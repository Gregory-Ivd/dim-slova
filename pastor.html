кого почати свідчити. Що радить урок?"}, {"q": "Що, за уроком, включає добра звістка? Оберіть усі правильні."}, {"q": "Що входить у бачення церкви щодо євангелізації? Оберіть усі правильні."}, {"q": "Євангелізація – це духовна війна, бо ми відбираємо в диявола людські душі."}, {"q": "Якщо християнин проповідує, він може не чекати, що Господь підтвердить слово знаменнями: це справа лише апостолів."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте за уроком, як росте служіння християнина в євангелізації."}, {"q": "Хто з людей поруч із вами – рідних, сусідів, колег – ще не чув доброї звістки? Що ви зробите цього тижня?"}]}, {"chapter": 2, "title": "Чому ми маємо євангелізувати", "questions": [{"q": "Що означає слово «шукати» в Луки 19:10 для нас?"}, {"q": "Чого, за образом рибалки, вчить урок?"}, {"q": "Колега-юрист завжди впевнений і успішний. Сестра думає: «Йому Бог не потрібен». Що з уроку стосується цього?"}, {"q": "Брат хоче свідчити, але йому байдуже до людей: «Я просто виконую доручення». Чого, за уроком, йому бракує?"}, {"q": "Які три речі, за Луки 10:1–3, 19, Ісус робить для нас?"}, {"q": "Християнин каже: «Встигну розповісти друзям про Ісуса колись потім». Який принцип уроку він ігнорує?"}, {"q": "Чому Павло, за Дії 20:26, міг сказати, що він чистий від крові всіх?"}, {"q": "Сестра почула урок про сторожа і злякалася: «Але ж я нікому не розповідала про Ісуса!» Що з уроку їй варто зробити?"}, {"q": "Які три відповідальності має кожен християнин? Оберіть усі правильні."}, {"q": "Які слова, за 1 Коринтян 15:3–4, мають бути головними в євангелізації? Оберіть усі правильні."}, {"q": "Велике доручення йти по всьому світу і проповідувати Євангеліє стосується кожного християнина."}, {"q": "Ісус їв з грішниками, бо був до них поблажливий і не надавав гріху значення."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як розгортається ланцюжок із Римлян 10:13–15? Розставте від першого кроку."}, {"q": "Напишіть список із кількох людей, за яких ви молитиметеся і з якими поговорите про Ісуса. Як ви відзначатимете результати?"}]}, {"chapter": 3, "title": "Як євангелізувати", "questions": [{"q": "Про що говорить Дії 19:8–10 – головне місце для принципів євангелізації першої церкви?"}, {"q": "Чому, за уроком, чудеса важливі в євангелізації?"}, {"q": "На вулиці людина насміхається і відкидає кожне слово, а поруч інша щиро слухає. Що порадить урок?"}, {"q": "Брат ніяковіє на вулиці і каже: «Мені соромно – люди ж засуджуватимуть». Що за уроком?"}, {"q": "Сестра молиться за спасіння подруги, і подруга раптом стала до неї ворожою. Як це пояснює урок?"}, {"q": "Хлопець хоче ходити на євангелізацію, «щоб знайомитися з дівчатами». Що каже урок?"}, {"q": "Скільки людей увірувало після одного чуда зцілення кульгавого, за Дії 4:4?"}, {"q": "Брат вирішив: «Буду євангелізувати, коли буде вільний час». Через місяць він жодного разу не вийшов. Який крок уроку він пропустив?"}, {"q": "Навіщо, за уроком, на євангелізацію ходять удвох? Оберіть усі правильні."}, {"q": "Що, за уроком, допомагає не лінуватися? Оберіть усі правильні."}, {"q": "Бог може підтвердити чудесами слова євангеліста будь-якого рангу – навіть через дітей."}, {"q": "Партнера в євангелізації краще не міняти, щоб звикнути одне до одного."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як за уроком розгорталася подія біля храму (Дії 3–4)? Розставте по порядку."}, {"q": "Яку мету – скільки людей мають покаятися – ви поставите собі на найближчий місяць? Що зробите, щоб вона росла?"}]}, {"chapter": 4, "title": "Один на один", "questions": [{"q": "Який метод євангелізації урок називає найефективнішим?"}, {"q": "З якого вірша починається дорога за Римлянами?"}, {"q": "Яка за уроком найкраща тривалість особистого свідчення?"}, {"q": "Під час розмови на вулиці співрозмовник розповідає, що його мама хворіє, а сам він шукає роботу. Що радить урок?"}, {"q": "Людина каже: «Я хороша, я ж не вбивця і не злодій». Яке місце з дороги за Римлянами тут доречне і чому?"}, {"q": "Брат підготував свідчення, але розповідає лише про свої успіхи в церкві і закінчує словами «ось так». Чого бракує за уроком?"}, {"q": "Чому важливо, щоб у молитві покаяння людина визнала Ісуса спершу Господом, а потім Спасителем?"}, {"q": "Людина вислухала все, але відмовляється молитися молитвою покаяння і не дозволяє помолитися за неї. Що радить урок?"}, {"q": "Що, за уроком, варто робити під час розмови «один на один»? Оберіть усі правильні."}, {"q": "Що, за уроком, має бути суттю особистого свідчення? Оберіть усі правильні."}, {"q": "Якщо людина збрехала лише один раз, Римлян 6:23 до неї не стосується."}, {"q": "Свідчення треба заздалегідь підготувати і кілька разів відрепетирувати."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте зупинки дороги за Римлянами по порядку."}, {"q": "Підготуйте своє особисте свідчення на дві хвилини: які проблеми були у вас і як Бог допоміг? Чим ви його завершите?"}]}, {"chapter": 5, "title": "Після покаяння і відповіді на заперечення", "questions": [{"q": "Що, за уроком, не можна робити одразу після молитви покаяння?"}, {"q": "Що буквально означає слово «гріх», за уроком?"}, {"q": "Новонавернений каже: «Хрищення – це формальність, я й так спасенний». Що з уроку стосується цього?"}, {"q": "Чоловік каже: «Спершу я кину пити, а тоді прийду до Бога». Що відповісти за уроком?"}, {"q": "Новонавернена плутається: «Мене спокушало, значить, я вже згрішила?» Що каже урок?"}, {"q": "Людина каже: «До церкви не піду – там самі лицеміри». Яку відповідь пропонує урок?"}, {"q": "Що, за Римлян 10:17, допомагає вірі новонаверненого рости?"}, {"q": "Знайома каже: «Я вірю в Бога, але до чого тут Ісус?» Яке місце з уроку тут ключове?"}, {"q": "Чого, за уроком, Бог чекає від новонаверненого? Оберіть усі правильні."}, {"q": "Чому, за уроком, «маленьких гріхів» не буває? Оберіть усі правильні."}, {"q": "Звичайна віра в Бога, за уроком, ще не є спасительною: навіть біси вірять і тремтять."}, {"q": "Завдання євангеліста – спершу довести людині з іншої церкви, що її церква неправильна."}, {"q": "Поєднайте заперечення з місцем Писання, яке урок пропонує у відповідь."}, {"q": "Розставте кроки «переходу кордону» в Царство Боже за уроком."}, {"q": "Яке заперечення невіруючих ви чуєте найчастіше? Як би ви відповіли на нього за уроком і яким місцем Писання?"}]}]}, {"slug": "pomazannia", "label": "Урок 11", "title": "Помазання", "chapters": [{"chapter": 1, "title": "Що таке помазання", "questions": [{"q": "Що таке помазання Святого Духа за уроком?"}, {"q": "Брат чудово грає на гітарі, усі ним захоплюються, але через його служіння нічого не змінюється. Що про це каже урок?"}, {"q": "Для чого, за уроком, дається помазання?"}, {"q": "Служитель почав використовувати служіння, щоб будувати власне ім’я і вплив – «своє царство». Що, за уроком, станеться?"}, {"q": "Новий служитель каже: «Коли мене висвятять на пастора, біси мене боятимуться». Що каже урок?"}, {"q": "Чому внутрішнє помазання важливе і для служіння іншим?"}, {"q": "Що, за уроком, разом показують 1 Івана 2:20, 27 та Івана 14:26?"}, {"q": "Сестра помітила, що молитва стала формальною, а Біблія «не відкривається». Вечорами вона дивиться сумнівні серіали. Що порадити за уроком?"}, {"q": "Які види помазання називає урок? Оберіть усі правильні."}, {"q": "Що робить внутрішнє помазання? Оберіть усі правильні."}, {"q": "Помазання може бути на людині, але не проявлятися, якщо вона не служить Богові."}, {"q": "За Об’явлення 22:11 і уроком, освячення має кінець: зрілому служителю внутрішнє помазання для змін уже не потрібне."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за уроком, помазання робить Божу волю реальною? Розставте по порядку."}, {"q": "Чи є ділянка, де Бог міг би вас помазати, але помазання не проявляється, бо ви там не служите? Що почнете робити?"}]}, {"chapter": 2, "title": "Помазання для служіння", "questions": [{"q": "Що, за уроком, показує Луки 4:18–19?"}, {"q": "Молодий служитель каже: «Сьогодні я нічого не відчуваю, тож за хворих молитися не буду». Що каже урок?"}, {"q": "Як, за Дії 10:38, Бог помазав Ісуса?"}, {"q": "Брат отримав несподіваний успіх у служінні й почав ним хизуватися. Що урок каже про те, коли Бог дає справжнє помазання на служіння?"}, {"q": "Чоловік каже: «Помазання від Бога, тож церква і служителі мені не потрібні». Що відповідає урок?"}, {"q": "Що зробив Єлисей після того, як Ілля накинув на нього плащ?"}, {"q": "Що означали два плащі Іллі?"}, {"q": "Новонавернений хоче одразу великого служіння і вважає «дрібницею» допомагати пасторові з побутовими справами. Що каже урок?"}, {"q": "Які якості Єлисея допомогли йому прийняти помазання? Оберіть усі правильні."}, {"q": "Що урок каже про помазання на допомогу іншим? Оберіть усі правильні."}, {"q": "Помазання на служіння визначає тільки Бог, а не голосування чи вплив людей."}, {"q": "Служити помазаникам треба навіть тоді, коли це йде на шкоду нашій відданості Ісусові."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за уроком, Бог помазує на служіння? Розставте по порядку."}, {"q": "Від чого вам, як Єлисею, треба відмовитися («заколоти волів»), щоб помазання мало перше місце у вашому житті?"}]}, {"chapter": 3, "title": "Шлях до помазання", "questions": [{"q": "Що означає «Ґілґал» і що він символізує в уроці?"}, {"q": "Церква роками робить усе однаково, «бо так заведено», і служіння стало сухим. Який крок шляху до помазання їм потрібен?"}, {"q": "Що урок каже про Божу присутність, яку символізує Бетель?"}, {"q": "Брат переміг бідність, навчився духовної війни і каже: «Я вже всього досяг». Що каже урок?"}, {"q": "Що символізує Єрихон на шляху до помазання?"}, {"q": "Сестра молиться: «Господи, дай мені хоч трохи – мені багато не треба», – і вважає це смиренням. Що каже урок?"}, {"q": "Чого попросив Єлисей в Іллі перед тим, як Іллю було взято (2 Царів 2:9)?"}, {"q": "Щойно покликаний служитель каже: «Бог мене покликав, тож тепер можу служити де завгодно і як хочу». Що каже урок?"}, {"q": "Що, за уроком, потрібно, щоб отримати і зберегти помазання? Оберіть усі правильні."}, {"q": "Що, за уроком, виганяє Божу присутність зі служіння? Оберіть усі правильні."}, {"q": "Коли приходить помазання, нейтральних людей не буде: одні радітимуть, інші заздритимуть."}, {"q": "За 2 Царів 2:1–15, коли Ілля запропонував Єлисею залишитися, той погодився."}, {"q": "Поєднайте місце на шляху Єлисея з його значенням."}, {"q": "Через які місця, за 2 Царів 2:1–6, пройшли Ілля і Єлисей? Розставте по порядку."}, {"q": "Який із кроків – Ґілґал, Бетель, Єрихон чи Йордан – зараз ваш? Що вам треба зробити, щоб іти далі?"}]}, {"chapter": 4, "title": "Спільне помазання", "questions": [{"q": "Що таке спільне помазання?"}, {"q": "Що, за уроком, показує Псалом 133:1–2 про олію, що стікає з голови?"}, {"q": "У малій групі постійні сварки й образи, але всі хочуть «сильного помазання». Що порадити за уроком?"}, {"q": "У церкві кожне служіння тягне в свій бік і має своє бачення. Навколо чого, за уроком, зазвичай будується єдність?"}, {"q": "Що сталося, коли учні однодушно перебували в молитві (Дії 1:14; 2:1, 4, 41)?"}, {"q": "Пастор і лідери щонеділі приходять просто «відпрацювати» зібрання, не проводячи часу в Божій присутності. Що каже урок?"}, {"q": "Церква перестала збиратися на молитву і прославлення, зібрання короткі й «по програмі». Що за уроком відбувається з такою церквою?"}, {"q": "Що сталося, коли Павло і Сила співали Богові в темниці (Дії 16:25–26)?"}, {"q": "Що, за уроком, створює атмосферу для спільного помазання? Оберіть усі правильні."}, {"q": "Що сталося в Дії 4:23–31? Оберіть усі правильні."}, {"q": "Спільне помазання не можна замінити помазанням на кожній окремій людині з групи."}, {"q": "Щоб досягти Євангелієм міста, досить помазання великих євангелістів."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Що сталося на П’ятидесятницю? Розставте по порядку."}, {"q": "Що особисто ви можете зробити для єдності у вашій церкві чи групі?"}]}, {"chapter": 5, "title": "Зцілення і зростання помазання", "questions": [{"q": "Хто, за уроком, приносить людям хвороби?"}, {"q": "Чому жінка з кровотечею зцілилася, а інші, хто тиснув Ісуса, – ні (Марка 5:25–34)?"}, {"q": "Людину зцілили, а через тиждень симптоми повернулися, і вона вирішила: «Значить, хвороба повернулася». Що порадити за уроком?"}, {"q": "Після зцілень на зібранні люди почали шанувати служителя як джерело сили. Що каже урок?"}, {"q": "Що відбувається на рівні води «по кісточки»?"}, {"q": "Відомий євангеліст каже: «Мені вже не треба повертатися до основ спасіння – я це давно пройшов». Що каже урок?"}, {"q": "Служителя підвели люди, на яких він розраховував, і він думає, що все скінчено. Що радить урок?"}, {"q": "Що, за уроком, означає образ з Єзекиїля 47: де тече потік, усе оживає і рибі немає ліку?"}, {"q": "Як, за уроком, помазання на зцілення переходило через Ісуса і Павла? Оберіть усі правильні."}, {"q": "Що урок каже про найвищий рівень – потік, через який треба пливти? Оберіть усі правильні."}, {"q": "Помазання на зцілення в Бога є завжди, але з боку людей потрібна віра, щоб воно проявилося."}, {"q": "Помазані служителі ніколи не помиляються."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за Єзекиїля 47, зростає помазання? Розставте рівні по порядку."}, {"q": "На якому рівні «води» з Єзекиїля 47 ви зараз? Що зробите, щоб помазання у вашому житті зростало?"}]}]}, {"slug": "sertse-sluhy", "label": "Урок 12", "title": "Серце слуги", "chapters": [{"chapter": 1, "title": "Що таке серце слуги", "questions": [{"q": "Що, за уроком, Ісус відповів учням, які сперечалися, хто з них більший (Матвія 20:24–29)?"}, {"q": "Що таке серце слуги за уроком?"}, {"q": "Сестра щонеділі допомагає на кухні, але робить це лише тому, що «так треба», і щоразу себе змушує. Що про це каже урок?"}, {"q": "Брат каже: «Серце слуги – це дар. У мене його немає, значить, мені й не дано». Що відповісти за уроком?"}, {"q": "Чому, за уроком, більшість людей не має серця слуги?"}, {"q": "Лідер мал имав удвічі більше помазання, ніж мав Ілля."}, {"q": "Поєднайте приклад з уроком, якого він навчає."}, {"q": "Розставте за уроком шлях Йосипа по порядку."}, {"q": "Кого з біблійних слуг з уроку вам найбільше хочеться наслідувати і що конкретно ви для цього зробите цього тижня?"}]}]}, {"slug": "vodinnia-dukhom-sviatym", "label": "Урок 13", "title": "Водіння Духом Святим", "chapters": [{"chapter": 1, "title": "Що таке водіння Духом", "questions": [{"q": "Що, за уроком, Бог гарантує тим, хто будує «дім» без Нього (Псалом 127:1–2)?"}, {"q": "Яка, за уроком, одна з причин, чому Бог послав Святого Духа, що живе в нас (1 Коринтян 2:9–12)?"}, {"q": "Брат каже: «Водіння Духом – для великих кризових моментів, а дрібниці вирішую сам». Що, за уроком, не так із цим підходом?"}, {"q": "Юнак три роки вчить китайську, бо «там мільярд людей», хоча Бог покликав його в Україну й Європу. Як це оцінює урок?"}, {"q": "Чому Святий Дух, за уроком, ніколи не поведе християнина проти Біблії?"}, {"q": "Один віруючий чекає, що Дух сам «візьме керування» його життям, а йому нічого не треба вирішувати. Що тут не так за уроком?"}, {"q": "Що, за уроком, чекає на людину, яка заради Божого керівництва відмовляється від плану, продуманого за людською логікою?"}, {"q": "Чоловік у зрілому віці каже: «Я лише 2 роки віруючий, мені ще рано розраховувати на водіння Духа». Що, за уроком, можна відповісти?"}, {"q": "Які твердження про людину відповідають уроку?"}, {"q": "Які твердження про освячення духа й душі відповідають уроку?"}, {"q": "Дух Святий може вести християнина всупереч Біблії, якщо ситуація особлива."}, {"q": "За уроком, тіло людини – це тимчасова оселя, схожа на одяг для духа."}, {"q": "З’єднайте місце Писання з думкою, яку воно ілюструє в уроці."}, {"q": "Розташуйте в порядку, як перебігає освячення людини за уроком."}, {"q": "Де у вашому житті ви досі «вирішуєте самі», не питаючи Бога, і що зміниться, якщо запитаєте Святого Духа?"}]}, {"chapter": 2, "title": "Внутрішнє свідчення", "questions": [{"q": "Кому, за уроком, свідчить Святий Дух, що ми стали Божими дітьми (Римлян 8:14–16)?"}, {"q": "Чим внутрішнє знання, за уроком, відрізняється від звичайних людських здогадів?"}, {"q": "Ви обираєте співробітника до служіння: блискучі таланти й рекомендації, але в дусі ви відчуваєте «ні». Що робити за уроком?"}, {"q": "Перед важливим рішенням у душі великий емоційний підйом, але в дусі миру немає. Як діяти за уроком?"}, {"q": "Чому, за уроком, не можна орієнтуватися на мир у душі?"}, {"q": "Ви помітили, що по дорозі до справи втратили внутрішній мир. Що робити за уроком?"}, {"q": "Що за аналогією світлофора з уроку означає «жовте світло»?"}, {"q": "Вас тягне зателефонувати людині або піти до неї, хоча це виглядає нелогічно. Як діяти за уроком?"}, {"q": "Які способи внутрішнього водіння називає урок?"}, {"q": "Що, за уроком, правильно про внутрішнє потягання Духа?"}, {"q": "Бог обіцяв видіння й чудеса на кожну життєву ситуацію."}, {"q": "Якщо щиро шукаєш Божої волі й сплутав своє бажання з Божим, Бог тебе виправить, як люблячий Отець, і покаже, як уникати таких помилок."}, {"q": "З’єднайте місце Писання з думкою, яку воно ілюструє."}, {"q": "Розташуйте за уроком послідовність дій, коли ви втратили внутрішній мир по дорозі до рішення."}, {"q": "Коли востаннє ви проігнорували внутрішнє «ні» або втрату миру? Чим закінчилося і що зробите інакше?"}]}, {"chapter": 3, "title": "Що заважає чути Бога · Слово", "questions": [{"q": "Що таке упередженість у пошуку Божої волі, за уроком?"}, {"q": "Що означає, за уроком, що Бог живе не в жеребі чи знаках, а в серцях?"}, {"q": "Сестра щоразу просить знак: «Якщо буде дощ, то Бог каже „так“». Що їй нагадати за уроком?"}, {"q": "Брат ухвалює серйозні рішення, ні з ким не радячись і не питаючи Бога: «я знаю, що роблю». Що тут не так за уроком?"}, {"q": "Чому, за уроком, людям так важко повірити внутрішньому свідченню?"}, {"q": "Ви в кризі й не бачите виходу. Що, за уроком, найбільше допоможе?"}, {"q": "Хто, за уроком, може отримувати глибокі одкровення Слова Божого?"}, {"q": "Як урок радить ставитися до порад людей у складних ситуаціях?"}, {"q": "Що, за уроком, належить до перешкод внутрішньому свідченню?"}, {"q": "Що, за уроком, правильно про одкровення Слова?"}, {"q": "Єгипетські чаклуни теж перетворили жезли на змій, тому самі надприродні явища ще не доводять, що це від Бога."}, {"q": "Одкровення Слова, за уроком, Бог використовує значно рідше, ніж внутрішнє свідчення."}, {"q": "З’єднайте місце Писання з тим, що воно показує."}, {"q": "Розташуйте в порядку шлях від кризи до виходу через Слово, як описує урок."}, {"q": "Яка з п’яти перешкод – найбільша у вашому житті, і що ви зробите цього тижня, щоб її зменшити?"}]}, {"chapter": 4, "title": "Совість, голос і пророцтво", "questions": [{"q": "Що таке внутрішній голос, за уроком?"}, {"q": "Чому, за уроком, не можна покладатися на совість невіруючого (див. 2 Коринтян 5:17)?"}, {"q": "Християнин систематично діє проти совісті й не кається, а вона дедалі тихіша. Що з нею відбувається за уроком?"}, {"q": "Сестра згрішила, але сумління мовчить, і вона думає: «Раз не болить, значить, гріха немає». Що про це каже урок?"}, {"q": "Що, за уроком, є мірилом правильності пророцтва для тебе особисто?"}, {"q": "Людина просить знайомого: «Пророкуй мені», і той «видає» що-небудь, аби відчепилися. Що не так за уроком?"}, {"q": "Віруючий постійно шукає чутного внутрішнього голосу і приймає будь-що почуте. Чим це, за уроком, небезпечне?"}, {"q": "Чим, за уроком, треба перевіряти голос, який чуєш усередині?"}, {"q": "Які твердження про совість віруючого відповідають уроку?"}, {"q": "Що, за уроком, правильно про пророцтво?"}, {"q": "Совість – це голос людського духа, тому віруючий може контролювати життя совістю, як Павло."}, {"q": "Дух Святий приходить, щоб осуджувати людину за гріх; осуджує саме Він, а не серце."}, {"q": "З’єднайте місце Писання з думкою, яку воно ілюструє."}, {"q": "Розташуйте в порядку, як, за уроком, треба діяти з пророцтвом, яке ти отримав особисто."}, {"q": "Чи є в вашому житті сфера, де ви звикли «перескакувати» через совість? Що зробите, щоб вона знову стала чутливою?"}]}, {"chapter": 5, "title": "Видіння і розвиток духа", "questions": [{"q": "Скільки видів видінь, за уроком, існує і які вони?"}, {"q": "Що, за уроком, сталося з Петром у Дії 10:9–20?"}, {"q": "Людина щоночі шукає «цікавих» снів, ніби Бог має її розважати. Що не так за уроком?"}, {"q": "Вам наснився незрозумілий сон, що залишив глибокий відбиток і непокоїть. Як діяти за уроком?"}, {"q": "Чим, за уроком, сон від Бога відрізняється від звичайного?"}, {"q": "Як, за уроком, треба ставитися до видіння, яке Бог дав?"}, {"q": "Який, за уроком, вид видіння Бог використовує найрідше й зазвичай для радикальних змін?"}, {"q": "Чому, за уроком, молитва іншими мовами важлива для розвитку духа?"}, {"q": "Що, за уроком, належить до способів розвивати дух?"}, {"q": "Що, за уроком, правильно про видіння?"}, {"q": "Видіння не замінює проповідь Євангелія: Корнилій, хоч і бачив ангела, потребував, щоб Петро прийшов і проповідав."}, {"q": "Щоб бути духовним, достатньо бути сповненим Духа, навіть якщо живеш за тілом."}, {"q": "З’єднайте місце Писання з видом/подією."}, {"q": "Розташуйте способи зміцнення духа в тому порядку, у якому їх називає урок."}, {"q": "Який із шести способів зміцнювати дух ви почнете робити цього тижня, і як конкретно?"}]}]}, {"slug": "dukh-sviatyi", "label": "Урок 14", "title": "Дух Святий", "chapters": [{"chapter": 1, "title": "Дух Святий – Особа", "questions": [{"q": "Що, за уроком, є першим, що треба знати про Святого Духа?"}, {"q": "Чому, за уроком, до Духа Святого треба ставитися як до Особи, а не як до сили?"}, {"q": "Брат каже: «Я відчуваю Духа лише коли мені радісно, а коли суха пора, то Його нема». Що урок відповідає на це?"}, {"q": "Ви ухвалили важливе рішення, а потім молитеся: «Господи, благослови». Що не так за уроком?"}, {"q": "Чому слова «Відокремте Мені Варнаву й Савла» (Дії 13) свідчать про те, що Дух має волю?"}, {"q": "Людина відчуває постійну тривогу й невпевненість у завтрашньому дні. Що, за уроком, це вказує?"}, {"q": "Що означає, за уроком, «загасити Духа» (1 Солунян 5:19)?"}, {"q": "Чоловік каже: «Я живу в сварках, але в церкві співаю, тож Дух зі мною». Яка думка уроку про це?"}, {"q": "Які ознаки Особи є в Духа Святого, за уроком?"}, {"q": "Що, за уроком, може засмучувати Духа Святого?"}, {"q": "Дух Святий – це безособова енергія, яку можна спрямувати за своїм бажанням."}, {"q": "Помазання Духа для одних – світло, а для інших – суд: це залежить від позиції людини перед Богом."}, {"q": "З’єднайте місце Писання з тим, що воно показує про Духа."}, {"q": "Розташуйте в порядку послідовність, яка веде до «загашення» Духа за образом з уроку."}, {"q": "Де у вашому житті ви ставитеся до Духа як до сили, а не до Особи, і що зміниться, якщо зверніться до Нього особисто?"}]}, {"chapter": 2, "title": "Дух Святий – Бог", "questions": [{"q": "Чому, за уроком, слова «в ім’я Отця, і Сина, і Святого Духа» (Матвія 28:19) важливі для розуміння Трійці?"}, {"q": "Яка, за уроком, божественна риса Духа не властива ні людині, ні ангелу (Римлян 8:11)?"}, {"q": "У людини «померло» служіння й молитва, вона думає, що це кінець. Що їй відповісти за уроком?"}, {"q": "Хтось каже: «Я накажу Духові діяти, і Він зобов’язаний». Що не так за уроком?"}, {"q": "Чому, за уроком, лише Дух може зробити проповідь одкровенням у серці слухача?"}, {"q": "Працівник на небезпечному заводі боїться, що там Дух його не знайде. Що, за уроком, він має знати?"}, {"q": "Що, за уроком, дає всемогутність Духа Святого для служіння (Дії 1:8)?"}, {"q": "До чого, за уроком, може призвести спроба діяти власною силою без Духа?"}, {"q": "Які божественні риси Духа Святого називає урок?"}, {"q": "Що, за уроком, свідчить про Божество Духа Святого?"}, {"q": "Дух Святий вічний: Він існує від початку, як Отець і Син."}, {"q": "Силу для служіння апостоли прийняли тоді, коли ходили з Ісусом, ще до зішестя Духа."}, {"q": "З’єднайте місце Писання з божественною рисою Духа."}, {"q": "Розташуйте за уроком події зі служіння Ісуса щодо Духа."}, {"q": "Яку сферу свого життя (служіння, молитву, сім’ю, працю) ви хотіли б, щоб Дух оживив, і що зробите, щоб запросити Його туди?"}]}, {"chapter": 3, "title": "Образи, місія і дружба з Духом", "questions": [{"q": "Що, за уроком, показує образ вітру (Дії 2:2–4)?"}, {"q": "Чому Дух Святий, за образом живої води, ніколи нікому Себе не нав’язує (Івана 7:38–39)?"}, {"q": "Вам здається, що ви «слабкі й нічого не вмієте» для служіння. Яку думку про Духа Святого пропонує урок?"}, {"q": "Брат каже, що Дух має виправдати його вчинок, бо «просто ми так звикли». Що не так за уроком?"}, {"q": "Чому, за уроком, Дух Святий називається Утішителем і як це пов’язано з Ісусом (Івана 14:16–17)?"}, {"q": "Вас пригнічує самотність і розчарування. Що за уроком про Утішителя?"}, {"q": "У чому, за уроком, різниця між тим, що викриває гріх, і нашою місією (Івана 16:7–11)?"}, {"q": "Коли Дух Святий доручає підійти до людини розповісти про Ісуса (як Філіппу), що це, за уроком, означає?"}, {"q": "Що, за уроком, є рисами образу єлею/олії?"}, {"q": "Які роботи Духа як Учителя називає урок?"}, {"q": "Дух Святий – Бог, тому Йому не потрібні наша любов і взаємність."}, {"q": "Не можна приказувати Духові, що робити, – потрібно слухатися Його в тому, що Він робить у Церкві."}, {"q": "З’єднайте образ Духа з тим, що він означає."}, {"q": "Розташуйте в порядку, як Дух, за уроком, діє у випадку Філіппа."}, {"q": "Де ви беретеся «викривати» людей замість Духа, і що зміниться, якщо ви лише говоритимете про Ісуса, а викриття залишите Йому?"}]}, {"chapter": 4, "title": "Вплив Духа й дари", "questions": [{"q": "Чому, за уроком, християнин має шукати Духа Святого, а не лише Його дарів (Матвія 6:33)?"}, {"q": "Яке місце Писання, за уроком, показує, що Дух утверджує внутрішню людину (Ефесян 3:16)?"}, {"q": "Брат у кризі пішов від церкви і перестав молитися, «поки не стане легше». Що йому порадити за уроком?"}, {"q": "Людина боїться виступити за Христа, бо знає про загрозу. Що з уроку може її підтримати?"}, {"q": "Чому Бог, за уроком, утверджує людину перед тим, як помазати її на серйозні справи?"}, {"q": "Вас мучить звичка, яку ви не можете подолати власною силою. Що, за уроком про Самсона й мотузки, допоможе?"}, {"q": "Що, за уроком, дає змогу пізнати Бога як Особу і Його спадщину для тебе (Ефесян 1:17–18)?"}, {"q": "Чоловік хоче, щоб дари Духа проявлялися, щоб усі його визнали. Як це оцінює урок?"}, {"q": "Які впливи Духа на життя віруючих називає урок?"}, {"q": "Які мотиваційні дари згадує урок?"}, {"q": "Помазання на служіння приходить від рук помазаника, а не від Бога."}, {"q": "Мотиваційні дари даються кожному віруючому за благодаттю."}, {"q": "З’єднайте мотивацію з її рисою."}, {"q": "Розташуйте в порядку, як Бог готує людину до помазання, за уроком."}, {"q": "Яку з рис впливу Духа (смілість, свобода, зміна серця, мудрість) вам найбільше потрібно зараз, і як ви запросите Його діяти?"}]}, {"chapter": 5, "title": "Дев’ять проявів Духа", "questions": [{"q": "Які три групи, за уроком, утворюють дев’ять проявів Духа?"}, {"q": "Чим слово знання, за уроком, відрізняється від знань, набутих у школі?"}, {"q": "Після «пророцтва» людина лишилася пригніченою й наляканою. Що, за уроком, це означає?"}, {"q": "Тебе просять: «Пророкуй мені». Чому, за уроком, не варто «витискати» пророцтво?"}, {"q": "Брат каже: «Я говорю мовами, отже, я вже достатньо духовний». Що на це відповідає урок?"}, {"q": "Чим, за уроком, відрізняється пророк від того, хто пророкує?"}, {"q": "Що урок радить, якщо дари зцілення не проявляються над хворим?"}, {"q": "Як, за уроком, перевірити, чи прояв духовного дару – від Бога?"}, {"q": "Що належить до дарів сили, за уроком?"}, {"q": "Які умови, за уроком, потрібні, щоб дари проявлялися через мене?"}, {"q": "Дар віри, про який говорить урок, – це та сама віра, що дається для спасіння від слухання Слова."}, {"q": "Дар чудотворення, за уроком, на час скасовує є для людини, яка в скруті?"}, {"q": "Колега каже: «Я хвалитиму Бога, коли мені стане легше». Що йому порадити за уроком?"}, {"q": "Чому, за уроком, хвала приводить до єдності Божого народу?"}, {"q": "Що, за уроком, є «жертвою хвали»?"}, {"q": "Вам важко хвалити Бога під час хвороби. Що, за уроком, означає хвала саме в такий час?"}, {"q": "Чому Давид, танцюючи перед ковчегом, відповів Мелхолі, що буде ще нижчим перед Господом?"}, {"q": "Які способи хвали тілом називає урок?"}, {"q": "Чому, за уроком, ми повинні хвалити Бога?"}, {"q": "Хвала Богові корисна лише духові, але не душі й тілу."}, {"q": "Хвала – одна з найсильніших зброй проти диявола."}, {"q": "З’єднайте біблійну подію з тим, що вона показує про хвалу."}, {"q": "Розташуйте за уроком у порядку, як хвала працює у випробуванні."}, {"q": "Яку складну ситуацію у вашому житті ви сьогодні можете «обернути» на хвалу, і як це виглядатиме конкретно?"}]}, {"chapter": 3, "title": "Шлях у присутність Божу", "questions": [{"q": "Які три частини мала скінія Мойсея і що вони прообразують за уроком?"}, {"q": "Яка дія характерна для зовнішнього двору, за уроком?"}, {"q": "Колега каже: «Я не хвалитиму, бо не відчуваю настрою». Яка перешкода тут за уроком і що робити?"}, {"q": "Людина відчуває провину за давній гріх, який уже сповідала, і через це не може хвалити Бога. Що, за уроком, їй порадити?"}, {"q": "Що, за уроком, мають на увазі, коли кажуть, що жертва «коштує» нам?"}, {"q": "Під час прославлення ви думаєте про обід удома й про те, хто як одягнений. Яка це перешкода і як її долати за уроком?"}, {"q": "Яка перешкода, за уроком, виникає, коли співаєш подобану мелодію, а слова – механічно?"}, {"q": "Брат боїться підняти руки на зібранні, бо його осудять. Яка перешкода, за уроком, і як її долати?"}, {"q": "Які перешкоди хвалі називає урок?"}, {"q": "Що, за уроком, допомагає в боротьбі з жалістю до себе?"}, {"q": "Святе святих у скінії – прообраз глибокого поклоніння, де людина переживає проявлену присутність Божу."}, {"q" є відповідальнішою."}, {"q": "З Богом можна співпрацювати як із мікрохвильовою піччю: швидко й одразу."}, {"q": "З’єднайте крок із прикладом."}, {"q": "Розташуйте за уроком кроки здійснення обітниці."}, {"q": "Яку з восьми порад про здійснення обітниць ви найчастіше пропускаєте і що зміните?"}]}]}]</script>
<script>(function () {
  'use strict';
  var root = document.documentElement;
  function $(s, el) { return (el || document).querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  $('#themeBtn').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    ls('sb-theme', next);
  });

  var qd = $('#quiz-data');
  var ENDPOINT = qd.getAttribute('data-endpoint') || '';
  var LESSONS = JSON.parse(qd.textContent);
  var bySlug = {};
  LESSONS.forEach(function (L) { bySlug[L.slug] = L; });

  var m = location.hash.match(/key=([^&]+)/);
  var KEY = m ? decodeURIComponent(m[1]) : ls('sb-pkey');
  if (m) ls('sb-pkey', KEY);

  var status = $('#status');
  function setStatus(t, err) { status.textContent = t; status.className = 'p-status' + (err ? ' err' : ''); }
  function cls(p) { return p >= 85 ? 'g' : p >= 60 ? 'y' : 'r'; }
  function fmtDate(iso, withTime) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var o = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return d.toLocaleString('uk-UA', o);
  }
  function norm(n) { return String(n).toLowerCase().replace(/[’'`ʼ]/g, '’').replace(/\s+/g, ' ').trim(); }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
  }

  /* ---------- вибір уроку ---------- */
  var sel = $('#lesson');
  sel.innerHTML = '<option value="all">Усі уроки – огляд</option>' + LESSONS.map(function (L) {
    return '<option value="' + esc(L.slug) + '">' + esc(L.label + ' · ' + L.title) + '</option>';
  }).join('');
  var cur = ls('sb-plesson');
  if (!cur || (cur !== 'all' && !bySlug[cur])) cur = 'all';
  sel.value = cur;
  sel.addEventListener('change', function () { cur = sel.value; ls('sb-plesson', cur); open = {}; render(); });

  var ROWS = [], open = {};

  // Учні з найкращими результатами по кожному тесту кожного уроку.
  function students(rows) {
    rows = rows.slice().sort(function (a, b) { return a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0; });
    var map = {};
    rows.forEach(function (r) {
      if (!bySlug[r.lesson]) return;
      var k = norm(r.name);
      var s = map[k] || (map[k] = { key: k, name: r.name, rows: [], devices: {}, t: {}, last: '' });
      s.name = r.name;
      s.rows.push(r);
      s.devices[r.uid] = 1;
      s.last = r.ts;
      var tk = r.lesson + '/' + r.ch;
      var t = s.t[tk] || (s.t[tk] = { best: 0, n: 0, latest: null });
      t.best = Math.max(t.best, r.pct);
      t.n++;
      t.latest = r;
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  // Стовпці таблиці: розділи уроку або уроки в огляді.
  function columns() {
    if (cur !== 'all') {
      return bySlug[cur].chapters.map(function (c) {
        return {
          head: 'Розділ ' + c.chapter, sub: c.title,
          cell: function (s) { var t = s.t[cur + '/' + c.chapter]; return t ? { pct: t.best, note: t.n + ' ' + plural(t.n, 'спроба', 'спроби', 'спроб') } : null; }
        };
      });
    }
    return LESSONS.map(function (L) {
      return {
        head: L.label, sub: L.title,
        cell: function (s) {
          var done = L.chapters.filter(function (c) { return s.t[L.slug + '/' + c.chapter]; });
          if (!done.length) return null;
          var avg = Math.round(done.reduce(function (a, c) { return a + s.t[L.slug + '/' + c.chapter].best; }, 0) / done.length);
          return { pct: avg, note: done.length + ' з ' + L.chapters.length + ' тестів' };
        }
      };
    });
  }

  function view() {
    var cols = columns();
    var list = students(ROWS).map(function (s) {
      var cells = cols.map(function (c) { return c.cell(s); });
      var vals = cells.filter(Boolean);
      s.cells = cells;
      s.done = vals.length;
      s.avg = vals.length ? Math.round(vals.reduce(function (a, v) { return a + v.pct; }, 0) / vals.length) : null;
      return s;
    }).filter(function (s) { return cur === 'all' || s.done; });
    return { cols: cols, list: list };
  }

  function renderTiles(v) {
    var tests = 0, sum = 0;
    v.list.forEach(function (s) { s.cells.forEach(function (c) { if (c) { tests++; sum += c.pct; } }); });
    var full = v.list.filter(function (s) { return s.done === v.cols.length; }).length;
    var week = Date.now() - 7 * 864e5;
    var active = v.list.filter(function (s) { return new Date(s.last).getTime() >= week; }).length;
    var all = cur === 'all';
    var t = [[v.list.length, plural(v.list.length, 'учень', 'учні', 'учнів')],
      [tests, all ? 'уроків розпочато' : 'пройдених тестів (без повторів)'],
      [tests ? Math.round(sum / tests) + '%' : '—', 'середній найкращий результат'],
      [full + ' з ' + v.list.length, all ? 'пройшли всі ' + v.cols.length + ' ' + plural(v.cols.length, 'урок', 'уроки', 'уроків') : 'пройшли всі ' + v.cols.length + ' тестів'],
      [active, 'активні за останні 7 днів']];
    $('#tiles').innerHTML = t.map(function (x) { return '<div class="tile"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('');
  }

  function renderGrid(v) {
    var q = norm($('#search').value), sort = $('#sort').value;
    var list = v.list.filter(function (s) { return !q || s.key.indexOf(q) >= 0; });
    list.sort(function (a, b) {
      if (sort === 'avg') return (b.avg === null ? -1 : b.avg) - (a.avg === null ? -1 : a.avg);
      if (sort === 'last') return a.last < b.last ? 1 : -1;
      return a.name.localeCompare(b.name, 'uk');
    });
    var span = v.cols.length + 3;
    var head = '<thead><tr><th>Учень</th>' + v.cols.map(function (c) {
      return '<th>' + esc(c.head) + '<small>' + esc(c.sub) + '</small></th>';
    }).join('') + '<th>Середній</th><th>Остання активність</th></tr></thead>';
    var body = list.map(function (s) {
      var dev = Object.keys(s.devices).length;
      var cells = s.cells.map(function (x) {
        if (!x) return '<td><span class="cell n">—</span></td>';
        return '<td><span class="cell ' + cls(x.pct) + '">' + x.pct + '%<small>' + esc(x.note) + '</small></span></td>';
      }).join('');
      var row = '<tr class="st" tabindex="0" data-k="' + esc(s.key) + '" aria-expanded="' + (open[s.key] ? 'true' : 'false') + '"><td>' + esc(s.name) +
        (dev > 1 ? '<small>' + dev + ' пристрої</small>' : '') + '</td>' + cells +
        '<td class="avg">' + (s.avg === null ? '—' : s.avg + '%') + '</td><td>' + esc(fmtDate(s.last)) + '</td></tr>';
      if (open[s.key]) row += '<tr class="det"><td colspan="' + span + '">' + details(s) + '</td></tr>';
      return row;
    }).join('');
    $('#grid').innerHTML = head + '<tbody>' + (body || '<tr><td colspan="' + span + '">Нікого не знайдено.</td></tr>') + '</tbody>';
  }

  function details(s) {
    var rows = s.rows.filter(function (r) { return cur === 'all' || r.lesson === cur; }).reverse().map(function (r) {
      var wrong = (r.q || []).map(function (v, i) { return v !== null && v < 1 ? i + 1 : null; }).filter(function (x) { return x; });
      var L = bySlug[r.lesson];
      return '<tr><td>' + esc(fmtDate(r.ts, true)) + '</td><td>' + (cur === 'all' ? esc(L.title) + ', р' : 'Р') + 'озділ ' + esc(r.ch) + '</td><td><b>' + esc(r.pct) + '%</b> (' + esc(r.score) + ' з ' + esc(r.max) + ')</td><td>' + esc(r.attempt) + '</td>' +
        '<td class="miss">' + (wrong.length ? 'Помилки в питаннях: ' + wrong.join(', ') : 'Без помилок') + '</td></tr>';
    }).join('');
    return '<table class="tries"><thead><tr><th>Коли</th><th>Тест</th><th>Результат</th><th>Спроба</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderQuestions(v) {
    var L = bySlug[cur];
    var html = L.chapters.map(function (c) {
      var sum = [], cnt = [];
      v.list.forEach(function (s) {
        var t = s.t[cur + '/' + c.chapter];
        if (!t) return;
        (t.latest.q || []).forEach(function (x, i) {
          if (x === null || x === undefined) return;
          sum[i] = (sum[i] || 0) + x; cnt[i] = (cnt[i] || 0) + 1;
        });
      });
      var qs = c.questions.map(function (qq, i) { return { i: i, text: qq.q, n: cnt[i] || 0, p: cnt[i] ? Math.round(sum[i] / cnt[i] * 100) : null }; })
        .filter(function (x) { return x.p !== null; });
      if (!qs.length) return '';
      qs.sort(function (a, b) { return a.p - b.p || a.i - b.i; });
      var id = 'qall' + c.chapter;
      var rows = qs.map(function (x, k) {
        return '<div class="qrow"' + (k >= 5 ? ' data-more="' + id + '" hidden' : '') + '><span class="no">№' + (x.i + 1) + '</span><span>' + esc(x.text) + '</span>' +
          '<span class="qbar ' + cls(x.p) + '"><span class="bar"><i style="width:' + x.p + '%"></i></span><span>' + x.p + '%<br><small>' + x.n + ' уч.</small></span></span></div>';
      }).join('');
      var more = qs.length > 5 ? '<button class="linkish qmore" type="button" data-toggle="' + id + '">Показати всі питання (' + qs.length + ')</button>' : '';
      return '<div class="qch"><h3>Розділ ' + c.chapter + '. ' + esc(c.title) + '</h3>' + rows + more + '</div>';
    }).join('');
    $('#questions').innerHTML = html || '<p class="p-hint">Ще немає даних.</p>';
  }

  function render() {
    var v = view();
    $('#gridHint').textContent = cur === 'all'
      ? 'Число – середній найкращий результат тестів уроку, під ним – скільки тестів пройдено. Натисніть на учня, щоб побачити всі спроби.'
      : 'Число – найкращий результат тесту, під ним – кількість спроб. Натисніть на учня, щоб побачити всі спроби.';
    renderTiles(v);
    $('#studentsCard').hidden = !v.list.length;
    $('#questionsCard').hidden = cur === 'all' || !v.list.length;
    $('#empty').hidden = !!v.list.length || !ROWS.length;
    if (!v.list.length) return;
    renderGrid(v);
    if (cur !== 'all') renderQuestions(v);
  }

  $('#questions').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-toggle]');
    if (!b) return;
    var id = b.getAttribute('data-toggle');
    document.querySelectorAll('[data-more="' + id + '"]').forEach(function (el) { el.hidden = false; });
    b.remove();
  });
  function toggleRow(tr) {
    var k = tr.getAttribute('data-k');
    open[k] = !open[k];
    renderGrid(view());
  }
  $('#grid').addEventListener('click', function (ev) { var tr = ev.target.closest('tr.st'); if (tr) toggleRow(tr); });
  $('#grid').addEventListener('keydown', function (ev) {
    var tr = ev.target.closest('tr.st');
    if (tr && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); toggleRow(tr); }
  });
  $('#search').addEventListener('input', function () { renderGrid(view()); });
  $('#sort').addEventListener('change', function () { renderGrid(view()); });

  $('#csvBtn').addEventListener('click', function () {
    var head = ['Час', 'Ім’я', 'Урок', 'Розділ', 'Тест', '%', 'Бали', 'З', 'Спроба', 'Пристрій'];
    var lines = [head].concat(ROWS.map(function (r) {
      var L = bySlug[r.lesson];
      return [new Date(r.ts).toLocaleString('uk-UA'), r.name, L ? L.title : r.lesson, r.ch, r.title, r.pct, r.score, r.max, r.attempt, r.uid];
    })).map(function (row) {
      return row.map(function (v) { v = String(v); if (/^[=+\-@]/.test(v)) v = '\'' + v; return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';');
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rezultaty-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  function load() {
    if (!ENDPOINT) return setStatus('Сторінку ще не під’єднано до таблиці результатів.', true);
    if (!KEY) return setStatus('Відкрийте сторінку за посиланням, яке вам надіслали: у ньому є ключ доступу.', true);
    setStatus('Завантаження…');
    fetch(ENDPOINT + '?key=' + encodeURIComponent(KEY))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) {
          setStatus(res.error === 'denied' ? 'Ключ доступу недійсний. Попросіть нове посилання.' : 'Помилка: ' + res.error, true);
          return;
        }
        ROWS = res.rows.map(function (r) { r.lesson = r.lesson || 'slovo-bozhe'; return r; });
        $('#csvBtn').disabled = !ROWS.length;
        $('#lessonBar').hidden = false;
        setStatus(ROWS.length ? 'Оновлено ' + new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) + '.'
          : 'Поки що ніхто не пройшов тест. Результати з’являться тут, щойно учні почнуть проходити тести.');
        render();
      })
      .catch(function () { setStatus('Не вдалося завантажити результати. Перевірте інтернет і натисніть «Оновити».', true); });
  }
  $('#reloadBtn').addEventListener('click', load);
  load();
})();
</script>
