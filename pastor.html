<style>/* ---------- кольори ---------- */
:root {
  --bg: #f4efe4;
  --paper: #fffdf8;
  --ink: #1f2430;
  --muted: #5d6474;
  --navy: #1f3a5f;
  --navy-deep: #152a45;
  --gold: #b0852b;
  --gold-soft: #f2e6c8;
  --gold-line: #dcc896;
  --scr-bg: #f8f1e1;
  --scr-ink: #3f3320;
  --note-bg: #edf1f6;
  --note-line: #9fb2c8;
  --key-bg: #1f3a5f;
  --key-ink: #fdfaf2;
  --mark: #f6e3ad;
  --ok: #2f7a4f;
  --ok-bg: #e5f2ea;
  --bad: #a3392f;
  --bad-bg: #f8e6e3;
  --part: #9a6b12;
  --part-bg: #f8eed6;
  --line: #e4dccb;
  --shadow: 0 1px 2px rgba(31, 36, 48, .06), 0 8px 24px rgba(31, 36, 48, .06);
  --fs: 18px;
  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  --display: "Cormorant Garamond", "PT Serif", Georgia, serif;
  --sans: "Montserrat", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141c; --paper: #161b25; --ink: #e8e4da; --muted: #a3a9b6;
    --navy: #9fbbe0; --navy-deep: #0d1a2c; --gold: #d4a94f; --gold-soft: #3a3120; --gold-line: #5c4c2b;
    --scr-bg: #1e2230; --scr-ink: #eadfc6; --note-bg: #1a2230; --note-line: #3f5673;
    --key-bg: #22385a; --key-ink: #f4efe2; --mark: #5a4a22;
    --ok: #7fcf9d; --ok-bg: #1d3327; --bad: #f09a8f; --bad-bg: #3a2220; --part: #e6c170; --part-bg: #3a3020;
    --line: #2a3140; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141c; --paper: #161b25; --ink: #e8e4da; --muted: #a3a9b6;
  --navy: #9fbbe0; --navy-deep: #0d1a2c; --gold: #d4a94f; --gold-soft: #3a3120; --gold-line: #5c4c2b;
  --scr-bg: #1e2230; --scr-ink: #eadfc6; --note-bg: #1a2230; --note-line: #3f5673;
  --key-bg: #22385a; --key-ink: #f4efe2; --mark: #5a4a22;
  --ok: #7fcf9d; --ok-bg: #1d3327; --bad: #f09a8f; --bad-bg: #3a2220; --part: #e6c170; --part-bg: #3a3020;
  --line: #2a3140; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

/* ---------- основа ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); line-height: 1.68; }
a { color: var(--navy); text-decoration-color: var(--gold-line); text-underline-offset: 3px; }
.print-only { display: none; }
.lbl { display: inline-block; font-family: var(--sans); font-size: .66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
strong { color: var(--navy); }
main { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }
main > section, .chapter { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: clamp(22px, 5vw, 56px); margin: 22px 0; }
p { margin: 0 0 1em; }

/* ---------- верхня панель ---------- */
.progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 60; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #e3c170); }
.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand .emblem { width: 30px; height: 30px; color: var(--gold); flex: none; }
.brand b { display: block; font-family: var(--sans); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.brand small { display: block; font-family: var(--sans); font-size: .66rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icon-btn, .chip { font-family: var(--sans); font-size: .72rem; font-weight: 600; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.icon-btn:hover, .chip:hover { border-color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.chip.solid { background: var(--navy); color: var(--paper); border-color: var(--navy); }
:root[data-theme="dark"] .chip.solid { color: #10141c; }
@media (max-width: 720px) {
  #memoBtn { font-size: 0; padding: 0; width: 36px; }
  #memoBtn::before { content: "👁"; font-size: 15px; }
  #fsDown, #fsUp { display: none; }
  .brand small { max-width: 44vw; }
}

/* ---------- зміст ---------- */
.toc-drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); background: var(--paper); z-index: 70; transform: translateX(-102%); transition: transform .25s ease; box-shadow: var(--shadow); overflow-y: auto; }
.toc-drawer.open { transform: none; }
.toc-inner { padding: 24px 22px 40px; }
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .4); z-index: 65; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.toc-list { list-style: none; margin: 10px 0 0; padding: 0; font-family: var(--sans); font-size: .8rem; }
.toc-list > li { margin: 0 0 12px; }
.toc-list > li > a { font-weight: 700; color: var(--ink); text-decoration: none; }
.toc-list ol { list-style: none; padding: 4px 0 0 12px; margin: 0; border-left: 2px solid var(--line); }
.toc-list ol a { display: block; padding: 3px 0; color: var(--muted); text-decoration: none; font-weight: 500; line-height: 1.35; }
.toc-list a.active { color: var(--gold); }
@media (min-width: 1280px) {
  .toc-drawer { transform: none; top: 53px; width: 290px; background: transparent; box-shadow: none; z-index: 10; }
  .toc-inner { padding-top: 28px; }
  #tocBtn, .scrim { display: none; }
  main { margin-left: max(310px, calc(50vw - 410px)); }
}

/* ---------- обкладинка ---------- */
.cover { background: radial-gradient(120% 90% at 50% 0%, #2a4c78 0%, #1f3a5f 45%, #122540 100%) !important; color: #f7f1e3; text-align: center; min-height: min(92vh, 860px); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.cover::before, .cover::after { content: ""; position: absolute; inset: 22px; border: 1px solid rgba(212, 169, 79, .45); border-radius: 12px; pointer-events: none; }
.cover::after { inset: 30px; border-color: rgba(212, 169, 79, .2); }
.cover-inner { position: relative; max-width: 560px; padding: 40px 10px; }
.cover-church { font-family: var(--sans); font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: #e3c882; margin: 0 0 34px; }
.cover-emblem { width: 92px; height: 92px; color: #d9b25e; margin: 0 auto 16px; display: block; }
.cover-school { font-family: var(--sans); font-weight: 600; letter-spacing: .34em; text-transform: uppercase; font-size: .86rem; margin: 0; color: #f1e7cf; }
.cover-name { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 2rem; color: #e3c882; margin: 2px 0 26px; }
.cover h1 { font-family: var(--display); font-weight: 600; font-size: clamp(3.4rem, 12vw, 6.2rem); line-height: 1; margin: 14px 0 8px; color: #fff8e8; letter-spacing: .01em; }
.cover-sub { font-family: var(--display); font-style: italic; font-size: 1.5rem; color: #e3c882; margin: 0 0 28px; }
.cover-meta { font-size: .86rem; line-height: 1.7; color: #cdd6e4; max-width: 460px; margin: 0 auto 36px; }
.cover-foot { display: flex; justify-content: center; gap: 26px; font-family: var(--sans); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: #aebbd0; margin: 0 0 26px; }
.cover-start { display: inline-block; font-family: var(--sans); font-size: .78rem; font-weight: 600; color: #1f3a5f; background: #e3c882; padding: 12px 22px; border-radius: 999px; text-decoration: none; }

/* ---------- передмова ---------- */
.epigraph { margin: 18px 0 30px; text-align: center; }
.epigraph blockquote { margin: 0 auto; max-width: 600px; font-family: var(--display); font-size: 1.75rem; line-height: 1.35; font-style: italic; color: var(--navy); }
.epigraph blockquote::before { content: "“"; display: block; font-size: 3.2rem; line-height: .6; color: var(--gold); margin-bottom: 6px; }
.epigraph figcaption, .prayer figcaption { font-family: var(--sans); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-top: 10px; }
.lead { font-size: 1.1rem; }
.prayer { margin: 28px 0; padding: 20px 24px; border: 1px dashed var(--gold-line); border-radius: 14px; text-align: center; }
.prayer blockquote { margin: 8px 0 0; font-family: var(--display); font-size: 1.35rem; font-style: italic; color: var(--scr-ink); }
.legend h3 { font-family: var(--sans); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.lg { padding: 12px 14px; border-radius: 10px; font-size: .82rem; line-height: 1.45; }
.lg b { display: block; font-family: var(--sans); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.lg-scr { background: var(--scr-bg); border-left: 3px solid var(--gold); }
.lg-key { background: var(--key-bg); color: var(--key-ink); }
.lg-key b { color: #e3c882; }
.lg-note { background: var(--note-bg); border-left: 3px solid var(--note-line); }
.lg-quiz { background: var(--gold-soft); }
.source-note { margin-top: 26px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- розділ ---------- */
.ch-head { position: relative; padding: 6px 0 26px; margin-bottom: 26px; border-bottom: 1px solid var(--gold-line); }
.ch-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 90px; height: 3px; background: var(--gold); }
.ch-num { font-family: var(--sans); font-size: .74rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.ch-head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: 1.08; color: var(--navy); margin: 8px 0 6px; }
.ch-sub { font-family: var(--display); font-style: italic; font-size: 1.3rem; color: var(--muted); margin: 0; }
h3.sec { display: flex; gap: 12px; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: 1.75rem; line-height: 1.2; color: var(--navy); margin: 46px 0 18px; }
.s-num { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: #fff; font-family: var(--sans); font-size: .9rem; font-weight: 700; transform: translateY(-3px); }
h4.sub { font-family: var(--sans); font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); margin: 34px 0 14px; display: flex; align-items: center; gap: 10px; }
h4.sub::after { content: ""; flex: 1; height: 1px; background: var(--gold-line); }

/* Святе Письмо */
.scripture { position: relative; margin: 22px 0 24px; padding: 20px 24px 14px 26px; background: var(--scr-bg); border-left: 4px solid var(--gold); border-radius: 4px 14px 14px 4px; }
.scripture blockquote { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.24rem; line-height: 1.5; color: var(--scr-ink); }
.scripture sup { font-family: var(--sans); font-size: .56rem; font-weight: 700; color: var(--gold); margin-right: 2px; vertical-align: .55em; }
.scripture .gap { color: var(--gold); }
.scripture figcaption { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.scripture .ref { font-family: var(--sans); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.scripture .syn { font-family: var(--sans); font-size: .66rem; color: var(--muted); }
.scripture .more { display: none; }
.scripture.collapsed blockquote { max-height: 11.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.scripture.long .more { display: inline-block; margin-top: 8px; font-family: var(--sans); font-size: .7rem; font-weight: 600; color: var(--navy); background: transparent; border: 1px solid var(--gold-line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
body.memo .scripture blockquote { filter: blur(7px); cursor: pointer; user-select: none; transition: filter .2s; }
body.memo .scripture.revealed blockquote { filter: none; }
body.memo .scripture::before { content: "Натисніть, щоб відкрити"; position: absolute; right: 14px; top: 10px; z-index: 1; font-family: var(--sans); font-size: .62rem; color: var(--muted); }
body.memo .scripture.revealed::before { content: none; }

/* Головна думка, пояснення */
.key-idea { margin: 24px 0; padding: 18px 24px 16px; background: var(--key-bg); color: var(--key-ink); border-radius: 14px; position: relative; }
.key-idea .lbl { color: #e3c882; }
.key-idea p { margin: 6px 0 0; font-family: var(--display); font-weight: 600; font-size: 1.32rem; line-height: 1.4; }
mark.key { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; font-weight: 700; padding: 0 1px; }
.note { margin: 20px 0; padding: 14px 20px; background: var(--note-bg); border-left: 3px solid var(--note-line); border-radius: 4px 12px 12px 4px; font-size: .93rem; }
.note .lbl { color: var(--muted); }
.note p { margin: 4px 0 0; }
ul.points { list-style: none; padding: 0; margin: 12px 0 18px; }
ul.points > li { position: relative; padding-left: 26px; margin-bottom: 12px; }
ul.points > li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); }
ul.points .li-head { margin-bottom: .35em; }
ul.points > li > p:not(.li-head) { margin-bottom: .6em; }

/* ---------- тест ---------- */
.quiz { margin-top: 50px; padding: 26px clamp(16px, 4vw, 30px); border-radius: 16px; background: linear-gradient(180deg, var(--gold-soft), transparent 220px); border: 1px solid var(--gold-line); }
.quiz-head h3 { font-family: var(--display); font-size: 1.9rem; color: var(--navy); margin: 6px 0 6px; line-height: 1.15; }
.quiz-intro { font-size: .9rem; color: var(--muted); }
.quiz-print { display: none; }
.q { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; margin: 14px 0; }
.q-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-family: var(--sans); font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.q-top .lvl { padding: 3px 8px; border-radius: 999px; background: var(--note-bg); }
.q-top .lvl.app { background: var(--gold-soft); color: var(--part); }
.q-text { font-weight: 700; margin-bottom: 12px; line-height: 1.5; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: pointer; font-size: .93rem; line-height: 1.45; }
.opt:hover { border-color: var(--gold-line); }
.opt input { margin-top: 4px; accent-color: var(--navy); flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.tf { display: flex; gap: 10px; }
.tf .opt { flex: 1 1 0; min-width: 0; justify-content: center; }
.match-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.match-row select { width: 100%; font: inherit; font-size: .86rem; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.match-row.right select { border-color: var(--ok); background: var(--ok-bg); }
.match-row.wrong select { border-color: var(--bad); background: var(--bad-bg); }
.match-row .fix { grid-column: 1 / -1; font-size: .8rem; color: var(--ok); }
@media (max-width: 560px) { .match-row { grid-template-columns: 1fr; } }
.order-list { list-style: none; padding: 0; margin: 0; counter-reset: ord; }
.order-list li { display: flex; gap: 8px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; background: var(--paper); font-size: .9rem; line-height: 1.4; counter-increment: ord; }
.order-list li::before { content: counter(ord); font-family: var(--sans); font-weight: 700; font-size: .75rem; color: var(--gold); width: 18px; flex: none; }
.order-list li span { flex: 1; }
.order-list button { font: inherit; font-size: .8rem; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; flex: none; }
.order-list li.right { border-color: var(--ok); background: var(--ok-bg); }
.order-list li.wrong { border-color: var(--bad); background: var(--bad-bg); }
.q textarea { width: 100%; min-height: 90px; font: inherit; font-size: .92rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
.fb { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: .88rem; line-height: 1.5; }
.q.done .fb { display: block; }
.q.ok .fb { background: var(--ok-bg); }
.q.bad .fb { background: var(--bad-bg); }
.q.part .fb { background: var(--part-bg); }
.q.reflect .fb { background: var(--note-bg); }
.fb b.st { font-family: var(--sans); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.q.ok .fb b.st { color: var(--ok); } .q.bad .fb b.st { color: var(--bad); } .q.part .fb b.st { color: var(--part); }
.fb a { font-family: var(--sans); font-size: .74rem; font-weight: 600; display: inline-block; margin-top: 6px; }
.q.missing { border-color: var(--bad); }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.btn { font-family: var(--sans); font-weight: 700; font-size: .8rem; padding: 12px 20px; border-radius: 999px; border: 0; cursor: pointer; background: var(--navy); color: var(--paper); }
:root[data-theme="dark"] .btn { color: #10141c; }
.btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--gold-line); }
.warn { font-size: .85rem; color: var(--bad); }
.result { margin-top: 18px; padding: 20px; border-radius: 14px; background: var(--paper); border: 1px solid var(--gold-line); display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { width: 112px; height: 112px; }
.ring text { font-family: var(--sans); font-weight: 700; font-size: 20px; fill: var(--ink); }
.result h4 { font-family: var(--display); font-size: 1.5rem; margin: 0 0 6px; color: var(--navy); }
.result p { margin: 0 0 8px; font-size: .9rem; }
.levels { grid-column: 1 / -1; display: grid; gap: 8px; }
.lvlbar { display: grid; grid-template-columns: 120px 1fr 48px; gap: 10px; align-items: center; font-family: var(--sans); font-size: .72rem; }
.lvlbar .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.lvlbar .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }

{"q": "Розташуйте етапи того, як, за уроком, з’явилася книга Єремії (і вся Біблія)."}, {"q": "Згідно з 1 Пет. 2:1–2 і Як. 1:21, щоб приймати Слово, треба щось «відкласти». Що саме у вашому серці зараз може бути перешкодою для сприйняття Слова?"}]}, {"chapter": 2, "title": "Характеристики Слова Божого", "questions": [{"q": "Чому, за уроком, Слово Боже неможливо змінити, хоча людські закони змінюються зі зміною влади?"}, {"q": "Державний закон забороняє те, чого навчає Слово Боже. Як, за прикладом Даниїла, має діяти християнин?"}, {"q": "Який висновок урок робить з Еф. 6:12 про те, де перебуває диявол?"}, {"q": "Проповідник каже: «Бог відкрив мені нове вчення, якого немає в Писанні, але воно навіть глибше за Євангеліє». Яке місце з уроку найпряміше відповідає на таку ситуацію?"}, {"q": "Що, за уроком, символізують у Іс. 40:8 трава, квіти і сонце?"}, {"q": "Як урок розрізняє проповідь і навчання Слова Божого?"}, {"q": "Людині, яка роками без роботи, Бог особисто сказав, що вона буде керувати підприємством. Єдина пропозиція – піти туди прибиральницею. Що радить урок?"}, {"q": "Історія Хієла, який відбудував Єрихон за днів Ахава, показує, що…"}, {"q": "Які чинники, за уроком, визначають «температуру» вогню Божого Слова в устах людини? Позначте всі."}, {"q": "Які твердження про виконання Слова Божого відповідають уроку? Позначте всі."}, {"q": "За уроком, у Єр. 5:14 Бог обіцяє зробити вогнем будь-які слова проповідника, якщо той говорить щиро."}, {"q": "У видінні сухих кісток (Єз. 37) Святий Дух прийшов і вдихнув життя після того, як попрацювало Слово Боже."}, {"q": "Урок пояснює, що грецьке слово «созо» у Рим. 1:16 означає лише прощення гріхів."}, {"q": "Зіставте місце Писання з думкою, яку урок з нього виводить."}, {"q": "Розставте в правильному порядку шлях, яким, за уроком, вивільняється Божа сила в слові."}, {"q": "Лідер хоче, щоб його група ожила і загорілася до служіння. Що урок називає першим засобом?"}, {"q": "Християнин роками ходить на служіння, але каже: «Мені вистачає проповідей, а систематичне навчання основ – це для новачків». Що, за уроком, з ним відбуватиметься?"}, {"q": "На чому зараз тримається твоє відчуття стабільності – на людях, грошах, таланті, популярності чи на Слові? Що, за Іс. 40:8 і 1 Петра 1:24–25, станеться з кожною з цих опор під «сонцем» випробувань?"}]}, {"chapter": 3, "title": "Що дає Слово Боже віруючому", "questions": [{"q": "Чому, згідно з уроком, людина, яка вже покаялася, все одно постійно потребує очищення Словом?"}, {"q": "Яке місце Писання урок наводить як відповідь на питання, як юнакові зберегти чистою свою дорогу?"}, {"q": "За уроком, освячення через Слово – це одноразова подія, яка стається в момент, коли людина вперше щиро прочитала Біблію."}, {"q": "Олег регулярно ходить на служіння й уважно слухає проповіді, але нічого з почутого не намагається виконувати: «Головне – слухати, Слово саме подіє». Що, згідно з уроком, він упускає?"}, {"q": "У яких двох напрямках, за уроком, Бог очищає нас через проповідуване Слово (Ів. 15:3)? Оберіть усі правильні."}, {"q": "Ірина активно служить у церкві, але зізнається собі, що робить це здебільшого, щоб її помітили й довели, що вона «не гірша за інших». Що каже урок про таке служіння?"}, {"q": "Чим, за визначенням уроку, є твердиня?"}, {"q": "Розташуйте в тому порядку, як урок описує шлях до поганого вчинку і те, де його можна зупинити."}, {"q": "Андрія постійно переслідують нечисті думки. Він вирішив просто «перетерпіти» силою волі, нічого не змінюючи в стосунках зі Словом. Яку пораду, згідно з уроком, варто йому дати?"}, {"q": "Зіставте місце Писання з думкою, яку урок до нього прив’язує."}, {"q": "Звідки, за уроком, приходить світло і свобода від Божого Слова?"}, {"q": "Досвідчений служитель отримав від Бога чітке спонукання почати нове служіння і одразу взявся до справи так, як робив колись раніше, бо «я це вже вмію». На яку небезпеку вказує урок?"}, {"q": "За уроком, щоб чинити мудро, людині обов’язково потрібна хороша освіта; без неї одкровення Слова мало що дає."}, {"q": "Що, згідно з уроком, робить Слово як світильник на нашому шляху? Оберіть усі правильні."}, {"q": "Людина тяжко хворіє і каже: «Своєю хворобою я прославляю Бога, тому не шукаю зцілення». Як урок пояснює такий стан?"}, {"q": "Як урок визначає засліплення?"}, {"q": "Згадайте рішення, яке ви маєте ухвалити найближчим часом. Як конкретно ви шукатимете в ньому світла Божого Слова – не лише «що робити», а й «як»?"}, {"q": "Чи є у вашому мисленні усталене переконання, яке постійно негативно впливає на ваше життя? Яким місцем Писання ви будете йому протистояти?"}]}, {"chapter": 4, "title": "Що ми маємо робити зі Словом Божим", "questions": [{"q": "Чому, за уроком, важливо, що Бог порівнює Своє Слово саме з хлібом?"}, {"q": "Сестра щодня поспіхом прочитує п’ять розділів, щоб «виконати норму», і вже ввечері не пам’ятає, про що читала. Як оцінює таке читання урок?"}, {"q": "Що, згідно з уроком, дає віруючому одкровення Слова Божого? Оберіть усі правильні варіанти."}, {"q": "Яким місцем Писання урок обґрунтовує думку, що Ісус будує Церкву на камені одкровення від Бога?"}, {"q": "Брат вкладає всі заощадження сім’ї в сумнівний проєкт і на застереження відповідає: «Я роблю це з віри». Що, за уроком, відрізняє виправданий ризик від невиправданого?"}, {"q": "Який головний висновок урок робить з історії про улов риби (Лк. 5:4–6)?"}, {"q": "Установіть відповідність між місцем Писання та думкою, яку урок із нього виводить."}, {"q": "Розташуйте етапи в тому порядку, у якому, за уроком, Слово Боже стає силою в житті людини."}, {"q": "Як, за уроком, найточніше перевірити, чи справді Слово живе у твоєму серці?"}, {"q": "Урок радить регулярно молитися про те, щоб Бог дав віру, адже віра приходить у відповідь на таке прохання."}, {"q": "Які причини зберігати Слово Боже в серці називає урок? Оберіть усі правильні."}, {"q": "Коли, згідно з уроком про дім на камені (Мт. 7:24–27), треба закладати основу свого життя?"}, {"q": "Друг раз у раз потрапляє в ті самі проблеми й щоразу каже: «Нічого, я вчуся на своїх помилках, набираюся досвіду». Що відповів би йому урок?"}, {"q": "Лідер малої групи вирішив проводити масові євангелізації на стадіонах, хоча Бог його до цього не кликав. Які небезпеки такого кроку називає урок? Оберіть усі правильні."}, {"q": "Церква кілька років зосереджена лише на власних внутрішніх проблемах і майже не говорить про Ісуса людям ззовні. Як оцінює таку ситуацію урок?"}, {"q": "Згідно з уроком, людина може проповідувати Євангеліє одразу після покаяння, і це її зміцнює."}, {"q": "Назви одну сферу свого життя, де ти чуєш Слово, але ще не виконуєш його. Що це означає за уроком і що ти зробиш цього тижня?"}, {"q": "Як ти читаєш Біблію: як «з’їдене» Слово чи як християнський звичай? Що конкретно зміниш у своєму читанні?"}]}, {"chapter": 5, "title": "Правила і методи вивчення та тлумачення Біблії", "questions": [{"q": "Яку помилку юдеїв, за уроком, показує Ів. 5:39–40 і вислів Гіллеля про слова Тори?"}, {"q": "Що ілюструє в уроці вислів Мартіна Лютера «Ми йдемо до колиски лише заради дитини»?"}, {"q": "За уроком, слухання й читання Писання дають «мікроскопічний» погляд, а вивчення й роздуми – «телескопічний»."}, {"q": "Зіставте метод вивчення Біблії з його описом."}, {"q": "Оксана хоче зрозуміти, що Біблія каже про святість. Вона відкриває симфонію на слові «святість» і виписує висновки в зошит із посиланнями. Який метод вона застосовує?"}, {"q": "Яке місце Писання урок наводить як доказ того, що саме Писання заохочує вивчати життя біблійних персонажів?"}, {"q": "Що, за уроком, варто робити під час вивчення Біблії? Оберіть усі правильні варіанти."}, {"q": "Що, за уроком, є метою біблійної герменевтики?"}, {"q": "Андрій бере один вірш, що йому сподобався, і будує на ньому висновок, не читаючи вірші до і після. Але висновок не узгоджується з темою розділу. Що каже урок про такий висновок?"}, {"q": "Хтось каже: «Я отримав нове одкровення з одного вірша, іншого підтвердження в Біблії для нього немає, але я впевнений». Яке правило уроку тут порушено?"}, {"q": "Урок радить звертатися до грецьких і єврейських слів, бо кілька різних грецьких слів можуть бути перекладені одним українським словом, хоча мають різні відтінки значення."}, {"q": "Як урок пояснює дії Бога й Авраама в Бут. 15:7–21?"}, {"q": "Що, за уроком, означає єврейська ідіома «лихе око» (Мт. 6:23; Мт. 20:15)? Оберіть усі правильні варіанти."}, {"q": "Хтось доводить, що Бог має людське тіло, бо Біблія говорить про Його «руку» (Іс. 59:1). Яку відповідь підказує урок?"}, {"q": "Хтось із притчі про невірного управителя (Лк. 16:1–9) робить висновок, що Бог схвалює хитрість у грошових справах. Яку помилку він робить, за уроком?"}, {"q": "Який єдиний урок, за конспектом, показує притча про вдову і неправедного суддю (Лк. 18:1–8)?"}, {"q": "Розташуйте правила тлумачення в тому порядку, у якому їх подано в уроці."}, {"q": "Згадайте вірш, який ви колись розуміли інакше, ніж тепер. Яке з семи правил тлумачення допомогло б вам зрозуміти його правильно одразу і чому?"}]}]}, {"slug": "vira", "label": "Урок 1", "title": "Віра", "chapters": [{"chapter": 1, "title": "Що таке віра і як нею жити", "questions": [{"q": "Що, за уроком, є стрижнем віри і саме виявляє віру та її рівень?"}, {"q": "Чому жінка з кровотечею – приклад саме віри, а не просто бажання зцілитися?"}, {"q": "Чим, за уроком, віра відрізняється від безглуздя?"}, {"q": "Поєднайте твердження з тим, що воно описує."}, {"q": "Оксана каже: «Я, звісно, вірю, що Бог зцілює. Але мене, мабуть, це не стосується – у мене особливий випадок». Як це назвати за уроком?"}, {"q": "Андрій двічі поспіль побачив на білбордах слово «Канада» і вирішив, що це Бог кличе його переїхати. Яку помилку він робить, за уроком?"}, {"q": "Віра, як і надія, спрямована в майбутнє."}, {"q": "Лікар поставив Петрові діагноз. Петро вирішив «жити вірою» і всім каже: «Я не хворий, жодної хвороби немає». Що, за уроком, тут неточно?"}, {"q": "Які твердження про Хому та Авраама відповідають уроку? Оберіть усі правильні."}, {"q": "Як урок визначає невіру?"}, {"q": "Ігор каже: «Мені не треба самому вірити – за мене молиться вся церква, а мама взагалі людина великої віри». Що заперечує йому урок?"}, {"q": "Які місця Писання урок наводить щодо невіри Ізраїлю в пустелі? Оберіть усі правильні."}, {"q": "Халев бачив тих самих велетнів, що й інші розвідники, але спирався на Божі слова."}, {"q": "Розставте події з прикладу Ізраїлю в тому порядку, як їх описує урок і Числа 13–14."}, {"q": "Де у вашому житті зараз «правда» (факти) говорить одне, а «істина» (Слово Боже) – інше? Яке слово Бога ви оберете?"}]}, {"chapter": 2, "title": "Як зростає віра і слова віри", "questions": [{"q": "Звідки, за уроком, у людини міра віри?"}, {"q": "Розставте за уроком, як діє принцип «віра від слухання» (Рим. 10:14–17)."}, {"q": "Марина щовечора молиться: «Господи, дай мені більше віри!», але Біблію майже не відкриває. Що їй порадити за уроком?"}, {"q": "За уроком, віра приходить просто від прочитання Слова, навіть без одкровення."}, {"q": "Що, за прикладом сотника і прокаженого, особливо зміцнює віру?"}, {"q": "Денис щойно увірував і хоче одразу «зрушити гори», але злякався першої дрібної проблеми. Який принцип із прикладу Давида допоможе йому?"}, {"q": "Від чого, за уроком, зростає віра? Оберіть усі джерела, названі в уроці."}, {"q": "Яке місце Писання ілюструє зростання віри через свідчення інших?"}, {"q": "Тарас бачив зцілення на конференції і тепер їздить з одного «служіння чудес» на інше, бо «вдома віра гасне». Що він упускає за уроком?"}, {"q": "Чому ім’я Ісуса не подіяло в синів Скеви?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Під час спільної молитви Ольга повторює за сусідкою: «Я здорова!», хоча в серці не має жодного одкровення і сумнівається. Що скаже урок?"}, {"q": "Які два види сповідання називає урок? Оберіть обидва."}, {"q": "Щоб просити Бога, потрібно так само багато віри, як і щоб наказати горі."}, {"q": "Які слова ви найчастіше говорите про свою найбільшу проблему? к?"}, {"q": "За уроком, випробування оминають лише віру, а сім’ю, роботу і посвяту – ні."}, {"q": "Чому дорогоцінна в Божих очах лише випробувана віра?"}, {"q": "Що, за уроком, означають «спокуси», які випробовують віру?"}, {"q": "Тетяна молилася за хвору матір, і раптом їй зателефонували: «Стан погіршився». Яке слово з уроку для неї найважливіше саме зараз?"}, {"q": "Після кількох важких місяців Роман каже: «Мабуть, я щось робив не так, якщо мене так випробовує. У справжнього християнина такого не буває». Що виправить урок?"}, {"q": "Олена в кризі перестала читати Біблію: «Зараз не до того, спершу треба вибратися». Що, за уроком, їй потрібно, щоб вистояти?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Які місця Писання урок наводить у темі «Віра завжди випробовується»? Оберіть усі правильні."}, {"q": "Розставте, як урок описує шлях випробуваної віри."}, {"q": "Згадайте своє останнє випробування. Що допомогло вам вистояти або що б ви зробили інакше тепер?"}]}, {"chapter": 5, "title": "Помічники і вороги віри", "questions": [{"q": "Чому, за уроком, віра без живих стосунків з Ісусом не працює?"}, {"q": "Віталій щодня годину молиться іншими мовами, але Біблію майже не читає і дивується, чому віра не зростає. Що пояснює урок?"}, {"q": "Іра давно ображена на сестру і не може пробачити, але не розуміє, чому її молитви «не працюють». На що вказує урок?"}, {"q": "Урок порівнює віру і довготерпіння з близнятами."}, {"q": "Максим перестав ходити в церкву: «Я й сам можу вірити», – і тепер проводить час лише з колегами-скептиками. Що, за уроком, з ним відбувається?"}, {"q": "Що урок називає помічниками віри? Оберіть усі правильні."}, {"q": "Що спільного, за уроком, між вірою і страхом?"}, {"q": "Звідки, за уроком, приходить страх? Оберіть усі правильні."}, {"q": "Чому Петро почав тонути, ідучи по воді?"}, {"q": "Щоранку Андрій годину гортає тривожні новини, а потім дивується, чому весь день боїться і не може молитися з вірою. Що, за уроком, варто змінити?"}, {"q": "Звідки, за уроком, походять сумніви і як їх перемагати?"}, {"q": "Поєднайте ворога віри з його описом в уроці."}, {"q": "Розставте, як страх, за уроком, «вимикає» віру на прикладі Петра."}, {"q": "За уроком, страх і віра можуть спокійно співіснувати в серці людини."}, {"q": "У якій сфері життя вам бракує віри? Які місця Слова ви почнете досліджувати?"}]}]}, {"slug": "dystsyplina", "label": "Урок 2", "title": "Дисципліна", "chapters": [{"chapter": 1, "title": "Цілі дисципліни і дисциплінарний процес", "questions": [{"q": "Як урок визначає дисципліну?"}, {"q": "Від чого, за уроком, значною мірою залежить успіх служіння?"}, {"q": "Що урок називає цілями дисципліни? Оберіть усі правильні."}, {"q": "Поєднайте складову дисциплінарного процесу з її описом."}, {"q": "Новонавернений Олег ще не знає, як християнинові поводитися з грошима. Що йому найперше потрібно за уроком?"}, {"q": "Ірина знала, що пліткувати неправильно, але останнім часом знову почала. Яка складова дисциплінарного процесу їй потрібна за уроком?"}, {"q": "Віктор різко розмовляє з людьми і щиро вважає це «прямотою». Що, за уроком, йому потрібно?"}, {"q": "Яке місце Писання урок наводить як приклад викриття?"}, {"q": "За уроком, викриття потрібне насамперед тому, хто знає, що помиляється."}, {"q": "Які місця Писання урок наводить щодо настанови? Оберіть усі правильні."}, {"q": "Розставте за уроком, як правильно реагувати на покарання."}, {"q": "Пастор зробив Андрієві зауваження за постійні запізнення на служіння. Андрій образився: «Мене тут не цінують». Що порадить урок?"}, {"q": "За уроком, змінюватися після покарання треба насамперед зовні, щоб інші побачили результат."}, {"q": "Яке місце Писання урок наводить щодо того, що покарання – можливість для навчання?"}, {"q": "Чим настанова відрізняється від виправлення, а виправлення – від викриття? Чого з цього вам зараз найбільше потрібно?"}]}, {"chapter": 2, "title": "Самодисципліна", "questions": [{"q": "Які якості, за уроком, необхідні для самодисципліни?  а допомогти йому з ремонтом. Яку складову характеру це ілюструє?"}, {"q": "Які місця Писання урок наводить щодо кротості? Оберіть усі правильні."}, {"q": "Урок називає радість частиною життя Божого Царства."}, {"q": "Чому, за уроком, для служителя характер важливіший за талант?"}, {"q": "У команді прославлення є дуже обдарований музикант, але він часто зриває репетиції і сперечається з усіма. Що, за уроком, тут головне?"}, {"q": "Розставте за уроком, як формується характер."}, {"q": "Яка зі складових Божого характеру найменше виявляється у вашому житті? Яке місце Писання з уроку ви візьмете для роздумів цього тижня?"}]}, {"chapter": 4, "title": "Планування і небезпеки дисципліни", "questions": [{"q": "Як урок визначає планування?"}, {"q": "Кого урок наводить як біблійні приклади планування? Оберіть усі правильні."}, {"q": "Яке місце Писання про нерозумне нехтування плануванням наводить урок?"}, {"q": "Оксана погоджується на всі прохання в церкві, на роботі й удома, а на головне – сім’ю і час із Богом – сил не лишається. Яку пораду уроку їй варто застосувати?"}, {"q": "За уроком, головне – працювати більше, а не раціональніше."}, {"q": "Поєднайте вид планування з його описом."}, {"q": "Розставте види планування за тривалістю – від найдовшого до найкоротшого."}, {"q": "Лідер молодіжки хоче зрозуміти, куди Бог веде його служіння на найближчі роки. З якого виду планування йому почати за уроком?"}, {"q": "Чим, за уроком, є дисципліна?"}, {"q": "Петро щодня встає о п’ятій на молитву і зневажливо дивиться на тих, хто так не робить: «Вони просто ліниві». Від якої небезпеки застерігає урок?"}, {"q": "Які небезпеки, пов’язані з дисципліною, називає урок? Оберіть усі правильні."}, {"q": "Чим, за уроком, аскетизм відрізняється від законництва?"}, {"q": "Однією з ознак аскетизму урок називає зневажливе ставлення до потреб тіла."}, {"q": "У домашній групі суперечка: чи «духовний» той, хто пропустив одне зібрання, якщо він доглядав хвору матір. Ведучий каже: «Правило є правило». ога не молися, ти недостойна. Передавай свої прохання через нашого старця – він буде за тебе посередником». Що скаже урок?"}, {"q": "За уроком, Ісус заступається за нас і тепер, а Його первосвященство – назавжди."}, {"q": "Що, за уроком, робить Ісус із моєю молитвою?"}, {"q": "Денис згрішив і думає: «Тепер Ісус мене тільки звинувачує, мені нема чого Йому сказати». Що з уроку йому важливо знати?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за уроком, ми можемо приєднатися до заступництва Ісуса?"}, {"q": "Як, за уроком, здійснюється служіння примирення? Оберіть усі правильні."}, {"q": "Що, за уроком, означає слово «підкріплює» в Римлян 8:26?"}, {"q": "Тарас не молиться, бо «Святий Дух і так за мене заступається невимовними зітханнями». Що виправить урок?"}, {"q": "Стогони під час глибокого заступництва іншими мовами урок пропонує приписувати дияволові."}, {"q": "Що, за уроком, правда про «невимовні зітхання»? Оберіть усі правильні."}, {"q": "Розставте за уроком, як моя молитва доходить до Отця разом із заступництвом Ісуса і Духа."}, {"q": "Під час молитви за хвору подругу Ліда відчула глибокий стогін у дусі і злякалася, що «щось не так». Що їй порадить урок?"}, {"q": "Чому Ісус – єдиний посередник між Богом і людиною і як ваше заступництво пов’язане з Його заступництвом?"}]}, {"chapter": 3, "title": "За що ми маємо заступатися", "questions": [{"q": "Як, за уроком, Павло пише про молитву за всіх святих?"}, {"q": "Олег каже: «Навіщо мені молитися за християн у Китаї чи Судані? У нас своїх проблем вистачає». Що відповідає урок?"}, {"q": "Поєднайте, за кого молитися, з тим, про що молитися за уроком."}, {"q": "Які види Божої волі називає урок? Оберіть усі правильні."}, {"q": "Брат у церкві почав грішити, і всі довкола його обговорюють і засуджують. Що, за уроком, варто зробити спершу?"}, {"q": "Про що, за уроком, треба молитися за служителів Божих? Оберіть усі названі в уроці."}, {"q": "Чому, за уроком, за служителів особливо важливо молитися?"}, {"q": "q": "Поєднайте якість заступника з думкою уроку."}, {"q": "Розставте якості заступника в тому порядку, у якому їх подає урок."}, {"q": "За кого з тих, за кого ви молитеся, вам важко молитися через брак любові? Що з уроку допоможе вам заступатися за цю людину?"}]}]}, {"slug": "kharakter", "label": "Урок 4", "title": "Характер", "chapters": [{"chapter": 1, "title": "Що таке характер і Божий характер в Ісусі", "questions": [{"q": "Що, за уроком, є основною ознакою, за якою можна виміряти зрілість людини?"}, {"q": "Що означає грецьке слово «характер», ужите в Євреїв 1:3?"}, {"q": "Що, за образом ложки і бруду, відбувається з характером людини під тиском?"}, {"q": "Що урок називає видами тиску, під яким виявляється характер? Оберіть усі правильні."}, {"q": "Олег завжди дає друзям мудрі поради про сім’ю, але вдома часто кричить на дружину. Як це назвати за уроком?"}, {"q": "Після болісного конфлікту Ірина помітила в собі злість, якої «раніше не було», і каже: «Це все через нього – він мене довів». Що порадить урок?"}, {"q": "Петро щиро вважав себе вірним, але під тиском зрікся Ісуса."}, {"q": "Що, за уроком, НЕ визначає зрілості людини? Оберіть усі правильні."}, {"q": "Тарас каже: «Я християнин, бо хрещений і щонеділі в церкві». Що, за уроком, означає бути християнином?"}, {"q": "Як урок пов’язує подобу Богові і владу (Бут. 1:26)?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Невіруючий колега каже Андрієві: «Я бачу, як поводяться віруючі в нашому офісі, – мені до вашої церкви не треба». Що, за уроком, тут виявилося?"}, {"q": "Мою вагу перед Богом визначають передусім дари й таланти."}, {"q": "Розставте за уроком історію Божої подоби в людині."}, {"q": "Згадайте останню ситуацію тиску у вашому житті. Що вона показала про ваш характер і яке рішення ви приймете?"}]}, {"chapter": 2, "title": "Динаміка розвитку характеру", "questions": [{"q": "На кому, за уроком, лежить відповідальність за розвиток характеру?"}, {"q": "Розставте послідовність формування характеру, яку називає урок."}, {"q": "З чим, за уроком, народжується дитина?"}, {"q": "Марта каже: «Я пробачила свекрусі один раз, але знову ображаюся. Мабуть, прощення – не моє». Що порадить урок?"}, {"q": "Що урок називає перешкодою № 1 для зміни характеру?"}, {"q": "Бог може змінити характер людини навіть всупереч її волі."}, {"q": "Через що, за уроком, змінюється характер? Оберіть усі правильні."}, {"q": "Поєднайте образ або приклад з думкою уроку."}, {"q": "Денис хоче навчитися терпіння, тому лише слухає проповіді про терпіння і молиться, щоб Бог прибрав усі дратівливі обставини. Що він не враховує?"}, {"q": "Від чого, за уроком, залежить, як швидко скінчаться труднощі, через які Бог формує характер?"}, {"q": "Дружина м’яко сказала Віталію, що він буває різким. Він відповів: «Ти сама не ідеальна!» Що порадить урок?"}, {"q": "Які місця Писання урок наводить про зміну характеру через Слово Боже? Оберіть усі правильні."}, {"q": "Знання й мудрість, за уроком, можуть компенсувати недосконалість характеру."}, {"q": "Аліна покаялася в заздрості, але каже: «Буду намагатися, як вийде». Чого, за уроком, бракує її рішенню?"}, {"q": "Яку одну дію ви почнете робити щодня, щоб вона стала звичкою і змінила ваш характер?"}]}, {"chapter": 3, "title": "Божий характер і характер служителя", "questions": [{"q": "Що, за уроком, сталося з характером людини після гріхопадіння і що можливо в Христі?"}, {"q": "Чим, за уроком, визначається справжня духовність?"}, {"q": "Сергій десять років у церкві, але досі дратівливий і нетерплячий. Він каже: «Значить, Бог мені ще не дав плоду Духа». Що скаже урок?"}, {"q": "Поєднайте рису Божого характеру з її протилежністю за уроком."}, {"q": "Розставте за уроком, як діє пожадливість (Як. 1:13–15)."}, {"q": "Про Ніну в церкві поширили неправдиві чутки. Вона хоче написати довгий пост, щоб «захистити своє ім’я». Яку рису Божого характеру нагадує їй урок?"}, {"q": "Дізнавшись, що в людини, яка колись його скривдила, згорів дім, Ігор усміхнувся: «Отримав своє». Яку перевірку з уроку він не пройшов?"}, {"q": "Від обітниці до її виконання Авраам чекав 25 років."}, {"q": "Звідки, за уроком, походить заздрість і як зрозуміти, що ти від неї вільний?"}, {"q": "Які риси урок називає складовими Божого характеру? Оберіть усі правильні."}, {"q": "Милосердя виражається передусім добрими словами співчуття."}, {"q": "Про що, описуючи вимоги до служителів, Павло не сказав жодного слова?"}, {"q": "Молодий лідер групи скаржиться: «Мене не слухають, хоча я все правильно пояснюю». Що, за уроком, важливіше за пояснення?"}, {"q": "Які місця Писання урок наводить у темі «Важливість характеру в житті служителя»? Оберіть усі правильні."}, {"q": "Яку рису плоду Духа вам найважче виявляти під тиском? Що ви зробите, щоб вона стала звичкою?"}]}]}, {"slug": "posluh", "label": "Урок 5", "title": "Послух", "chapters": [{"chapter": 1, "title": "Послух Богові", "questions": [{"q": "Що, за уроком, є послух?"}, {"q": "Чому обітована земля з Повторення Закону 11 – образ життя християнина?"}, {"q": "Олег каже: «Я б давав десятину, але дружина проти – це вона винна». Що порадить урок?"}, {"q": "Після сильної проповіді Ірина вирішила молитися щодня, а через тиждень з’явилося багато справ, і вона перестала. Що сталося?"}, {"q": "Як урок пов’язує Слово, що перебуває в серці, з послухом?"}, {"q": "Андрій щовечора дивиться серіали, після яких йому важче молитися, і каже: «Мені все дозволено». Що відповідає урок?"}, {"q": "Що, за 1 Самуїла 15:22–23, краще за жертву?"}, {"q": "Петро ретельно служить у великих справах, але дрібні заповіді вважає неважливими і чекає від Бога особливого доручення. Чого він не враховує?"}, {"q": "Що, за уроком, підсилює бажання бути послушним Богові? Оберіть усі правильні."}, {"q": "Які два боки має страх Божий? Оберіть правильні."}, {"q": "Благодать не знімає з християнина відповідальності бути послушним Богові."}, {"q": "Людина не відповідає за думку, що до неї прийшла, але відповідає за те, що з нею зробила."}, {"q": "Поєднайте біблійну особу з уроком про послух."}, {"q": "Розставте кроки шляху до блаженства й успіху, які урок виводить з Якова 1:21–25 та Ісуса Навина 1:8."}, {"q": "Що у вашому оточенні – друзі, фільми, звички – послаблює ваше бажання слухатися Бога? Яке якісне рішення ви ухвалите?"}]}, {"chapter": 2, "title": "Послух людині", "questions": [{"q": "Які три види послуху називає урок?"}, {"q": "Що означає принцип «треба коритися більше Богові, ніж людям» (Дії 5:29)?"}, {"q": "Директор вимагає від бухгалтерки Олени приховати доходи від податків, бо «всі так роблять». Що порадить урок?"}, {"q": "Студент-християнин списує на іспиті, бо «всі списують, а викладач несправедливий». Що каже урок?"}, {"q": "Що урок називає підробкою послуху?"}, {"q": "Невіруючий батько кличе сина-християнина разом красти. Як, за уроком, учинити синові?"}, {"q": "Що, за Ефесян 6:1–3, Бог обіцяє тим, хто шанує батьків?"}, {"q": "Наталя покаялася і тепер постійно повчає невіруючого чоловіка й не слухається його, «бо він не знає Бога». Що порадить урок?"}, {"q": "Кого, за уроком, християнин має слухатися? Оберіть усі правильні."}, {"q": "Що, за уроком, заважає взаємному послуху в церкві? Оберіть усі правильні."}, {"q": "Дорослі діти, які мають власну сім’ю, вже не зобов’язані підкорятися батькам, але шанувати їх треба завжди."}, {"q": "Коли влада ухвалює погані закони, християни мають право бунтувати проти неї."}, {"q": "Поєднайте місце Писання з тим, кого і кому воно закликає слухатися."}, {"q": "Розставте події так, як урок описує поведінку апостолів перед синедріоном."}, {"q": "Кого з поставлених над вами людей вам найважче слухатися? Що зміниться, якщо служити йому, як Господу?"}]}, {"chapter": 3, "title": "Послух духовній владі", "questions": [{"q": "Хто, за уроком, є джерелом влади в духовному і фізичному світі?"}, {"q": "Чому Бог сказав Самуїлові: «Не тебе відкинули, а Мене»?"}, {"q": "Лідер доручив Вікторові провести захід певним чином, а Віктор зробив «краще» – по-своєму. Що каже урок?"}, {"q": "У групі обговорюють машину й одяг пастора, і Світлана долучається: «Я ж нічого поганого не кажу». Що каже урок?"}, {"q": "Чому Бог не дає людині власного помазання і влади одразу?"}, {"q": "Максим каже: «Мені не потрібні пастор і лідер, у мене особисті стосунки з Богом». Що відповідає урок?"}, {"q": "Від чого, за Вихід 17:10–13, залежала перемога над Амаликом?"}, {"q": "Іван, якому за п’ятдесят, не сприймає всерйоз двадцятирічного лідера домашньої групи. Що порадить урок?"}, {"q": "Що, за Ефесян 4:11–14, Бог робить через духовну владу? Оберіть усі правильні."}, {"q": "У чому, за уроком, виявляється пошана до лідера? Оберіть усі правильні."}, {"q": "Лідерів у церкві ставить Бог, але через пастора."}, {"q": "Непослух лідерові, за уроком, – наслідок гордості, а послух – смирення."}, {"q": "Поєднайте приклад з уроком про духовну владу."}, {"q": "Розставте кроки виходу з ситуації, коли народ говорив проти Мойсея (Числа 21:5–9)."}, {"q": "Як ви думаєте й говорите про своїх лідерів? Що потрібно змінити, щоб ваш лідер радів, а не зітхав через вас?"}]}, {"chapter": 4, "title": "Плоди послуху і наслідки непослуху", "questions": [{"q": "Що, за Івана 14:23, Бог робить для того, хто любить Ісуса і дотримується Його слова?"}, {"q": "Що, за уроком, означає прокляття?"}, {"q": "Лесю незаслужено звинувачують на роботі, і вона витрачає всі сили, щоб виправдатися перед усіма. Чого вчить приклад Ісуса?"}, {"q": "Тарас давно у вірі, але йому не хочеться молитися, читати Біблію й іти на служіння, а одкровень давно немає. Що каже урок?"}, {"q": "Для чого Бог противиться непослушному християнинові?"}, {"q": "Бог спонукає Івана поговорити з важким сусідом про Євангеліє, а той відмовляється – і в його житті почалася «буря» проблем. Що порадить урок?"}, {"q": "Про кого сказано, що він не відступив від жодного слова з того, що Господь наказав Мойсеєві (Ісус Навин 11:15)?"}, {"q": "Оксана каже, що щотижня відчуває на зібранні Божу присутність, хоча її життя за роки не змінилося і заповідей вона не тримає. Що каже урок?"}, {"q": "Які плоди послуху Богові називає урок? Оберіть усі правильні."}, {"q": "Які наслідки непослуху називає урок? Оберіть усі правильні."}, {"q": "Через послух однієї людини благословення може прийти на її сім’ю і церкву."}, {"q": "Бог любить лише послушних, тож непослушний християнин Божої любові не має."}, {"q": "Поєднайте приклад послушної людини з її вчинком."}, {"q": "Розставте Божі накази, якими випробовувався послух Авраама, у тому порядку, як їх називає урок."}, {"q": "Який плід послуху ви найбільше хочете побачити у своєму житті і в якому конкретному питанні почнете слухатися Бога вже цього тижня?"}]}]}, {"slug": "molytva", "label": "Урок 6", "title": "Молитва", "chapters": [{"chapter": 1, "title": "Що таке молитва", "questions": [{"q": "Що таке молитва за першим визначенням уроку?"}, {"q": "Чому, за Якова 4:2, деякі люди не отримують від Бога того, чого потребують?"}, {"q": "Марко вранці за дві хвилини перелічує Богові всі свої потреби і біжить на роботу, не чекаючи відповіді. Яку помилку він робить?"}, {"q": "Оля соромиться просити Бога про роботу: «Не хочу турбувати Бога дрібницями, сама впораюся». Що порадити їй за уроком?"}, {"q": "Як урок пояснює зв’язок молитви і стосунків з Богом?"}, {"q": "Під час молитви Андрій думає про футбол, а вустами промовляє правильні слова. Що каже урок?"}, {"q": "Яке місце Писання називає молитви святих фіміамом (пахощами)?"}, {"q": "Ігор пропустив кілька днів молитви, сумління мучить, і він «відбуває» хвилинну молитву перед сном, щоб заспокоїтися. Як це оцінює урок?"}, {"q": "Які поради урок дає, щоб привчити розум до молитви? Оберіть усі правильні."}, {"q": "Що урок каже про спілкування перших людей з Богом? Оберіть усі правильні."}, {"q": "Люди не чують Бога з двох причин: або не питають Його, або не слухають відповіді."}, {"q": "Щоб Бог прийняв наші молитви, сьогодні потрібні люди-посередники, як священники в Старому Заповіті."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розташуйте, як урок описує спілкування-діалог."}, {"q": "Чого у вашій молитві більше – говоріння чи слухання? Що ви зміните, щоб молитва стала спілкуванням?"}]}, {"chapter": 2, "title": "Навіщо і коли молитися", "questions": [{"q": "Що, за уроком, є першочерговою функцією храму, яким сьогодні є ми?"}, {"q": "Що означає «не занепадати духом» у Луки 18:1?"}, {"q": "У церкві чудові програми й заходи, але молитовні зібрання давно порожні. На що, за уроком, вона ризикує перетворитися?"}, {"q": "Наталя каже: «Молюся, коли є настрій, бо без настрою це лицемірство». Що відповідає урок?"}, {"q": "Чому урок порівнює людину, яка не молиться, з духовно п’яною?"}, {"q": "Віктор після великого євангелізаційного вечора, де багато служив, хоче до ночі дивитися серіал, а молитву відкласти. Що радить урок?"}, {"q": "Де описано, що апостоли доручили служіння при столах іншим, щоб перебувати в молитві і служінні Слова?"}, {"q": "Олена планує відкрити власну справу. Що з теми «молитися вранці» стосується її задуму?"}, {"q": "Що сталося, коли апостоли помолилися після погроз (Дії 4:23–31)? Оберіть усі правильні."}, {"q": "Що урок каже про молитву «завжди»? Оберіть усі правильні."}, {"q": "Для апостолів молитва скасовувала служіння при столах."}, {"q": "Жити за рахунок учорашніх молитов неможливо: духовне зростання приходить від постійності."}, {"q": "Поєднайте час молитви з поясненням з уроку."}, {"q": "Розташуйте, як урок описує занепад «дому молитви» в людині."}, {"q": "Коли у вашому тижні є постійний час для молитви? Що заважає зробити його щоденним і як ви це зміните?"}]}, {"chapter": 3, "title": "Де і як молитися", "questions": [{"q": "У чиє ім’я, за новозавітним порядком, треба просити Отця?"}, {"q": "Чим, за уроком, Івана 14:13 відрізняється від Івана 16:23?"}, {"q": "Сергій на молодіжному зібранні молиться голосно й довго, щоб усі побачили, який він духовний, а вдома майже не молиться. Що каже урок?"}, {"q": "Ганна просить у Бога змін у житті, але в глибині душі їх не дуже хоче – звикла до старого. Що тут не так за уроком?"}, {"q": "Як урок розрізняє сумнів і невіру?"}, {"q": "Дмитро хворіє і щовечора дякує Богові «за хворобу, яку Він послав». Що порадив би урок?"}, {"q": "Яке місце урок наводить, коли закликає нагадувати Богові Його обітниці?"}, {"q": "Юлія чотири дні молиться про важливе питання, відповіді немає, і вона вирішує: «Мабуть, Бог не хоче». Що каже урок?"}, {"q": "Де, за уроком, можна молитися? Оберіть усі правильні."}, {"q": "Що урок каже про молитву з вірою? Оберіть усі правильні."}, {"q": "За уроком, в ім’я Отця, Сина і Святого Духа треба молитися."}, {"q": "Молитва насамоті дає найбільший ефект і виражає нашу любов до Бога."}, {"q": "Поєднайте умову дієвої молитви з думкою уроку."}, {"q": "Розташуйте образ з Екклезіяста 11:3 так, як його пояснює урок."}, {"q": "Яка з умов дієвої молитви (в ім’я Ісуса, за Словом, з обітницями, наполегливо, з вірою, з подякою) вам найважча і як ви її розвиватимете?"}]}, {"chapter": 4, "title": "Перешкоди в молитві і види молитов", "questions": [{"q": "Що, за Псалмом 66:18, робить молитву непочутою?"}, {"q": "До кого звертаються в молитві віри?"}, {"q": "Петро щиро плаче на молитві, просячи Божої допомоги, але вперто не робить того, що Бог йому вже сказав. Чому, за уроком, відповіді немає?"}, {"q": "Марина роками тримає образу на сестру й чекає, що та «нарешті все визнає». Як це впливає на її молитви?"}, {"q": "Чим молитва віри відрізняється від чаклунської молитви?"}, {"q": "Олег просить у Бога велике служіння, щоб про нього говорили і йому заздрили. Чому, за уроком, Бог не відповість?"}, {"q": "Яке місце Писання говорить, що чоловік, який кривдить дружину, має перешкоди в молитвах?"}, {"q": "Двоє друзів моляться за хворого товариша: один – про зцілення, другий – про вдалу операцію, і не домовилися між собою. Що радить урок про молитву згоди?"}, {"q": "Які перешкоди в молитві названо в уроці? Оберіть усі правильні."}, {"q": "Що охоплює молитва спілкування? Оберіть усі правильні."}, {"q": "У молитві духовної війни ми воюємо з людьми, через яких діє диявол."}, {"q": "Образа і непрощення – одне й те саме."}, {"q": "Поєднайте вид молитви з його ознакою."}, {"q": "Розташуйте Божі умови з 2 Хронік 7:14 у порядку, як їх наводить урок."}, {"q": "Яка з перешкод у молитві найбільше стосується вас і що ви зробите цього тижня, щоб її усунути?"}]}, {"chapter": 5, "title": "Ісус у молитві, приклади молитов і піст", "questions": [{"q": "Що сталося, коли Ісус молився після хрещення?"}, {"q": "Чому, за уроком, без молитви піст не має сенсу?"}, {"q": "Пастор Андрій так завантажений служінням, що місяцями не має часу на особисту молитву, але служить далі. Що, за уроком, з ним станеться?"}, {"q": "Світлана три дні постить, але цілком зайнята роботою й гостями і зовсім не молиться. Як оцінює це урок?"}, {"q": "Чого вчить приклад Анни, яка просила сина й обіцяла віддати його Господу?"}, {"q": "Ірина має вирішити, чи виходити заміж за Максима. Подруги радять «слухати серце». Що з прикладу Ісуса радить урок?"}, {"q": "Де описано, як Ілля молився сім разів, доки не з’явилася хмаринка?"}, {"q": "Богдан постить, щоб Бог «обов’язково зробив» по-його, хоч знає, що це суперечить Божій волі. Що каже урок?"}, {"q": "Які види посту названо в уроці? Оберіть усі правильні."}, {"q": "Що показують преображення Ісуса і Гетсиманія? Оберіть усі правильні."}, {"q": "Ілля, за Якова 5:17, був людиною, подібною до нас."}, {"q": "Абсолютний піст є мірилом духовності."}, {"q": "Поєднайте біблійного молитовника з його молитвою."}, {"q": "Розташуйте події початку служіння Ісуса так, як у уроці."}, {"q": "Як Ісус, ви маєте вміти «відпустити народ», щоб знайти час для Бога. Від чого ви відмовитеся цього тижня заради молитви?"}]}]}, {"slug": "blahodat", "label": "Урок 7", "title": "Благодать", "chapters": [{"chapter": 1, "title": "Що таке благодать і як вона діє", "questions": [{"q": "Що таке благодать за уроком?"}, {"q": "Який принцип Павло формулює в Римлян 11:6?"}, {"q": "Брат, який уже десять років у церкві, каже про спасіння: «Це для мене давно звична річ», – і перестав за нього дякувати. Яку небезпеку бачить урок?"}, {"q": "Служитель каже: «Я стільки зробив для церкви, що Бог тепер мусить мені відповісти». Який принцип він порушує?"}, {"q": "Чому, за уроком, благодать та істина завжди йдуть разом (Івана 1:16–17)?"}, {"q": "Людина ретельно дотримується всіх правил, але в серці досі хоче грішити. Як урок це називає?"}, {"q": "Поза ким, за уроком, благодать не може діяти в житті людей (1 Коринтян 1:4)?"}, {"q": "Молодий віруючий каже: «Я стану праведним, коли перестану грішити і робитиму більше добрих справ». Що порадити йому за уроком?"}, {"q": "Що урок каже про благодать? Оберіть усі правильні."}, {"q": "Що, за уроком, відрізає людину від благодаті або закриває її дію? Оберіть усі правильні."}, {"q": "Відкрити Себе людям через Ісуса Христа було Божою ініціативою: якби Він Сам нас не знайшов, ми ніколи б Його не пізнали."}, {"q": "Оскільки на діла покладатися не можна, християнину не потрібно робити добрих справ."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте в правильному порядку, як за уроком пов’язані праведність і діла."}, {"q": "Чи є у вашому житті ділянка, де ви намагаєтеся заслужити те, що Бог дає з благодаті? Що ви зміните?"}]}, {"chapter": 2, "title": "Благодать дається смиренним", "questions": [{"q": "Кому, за Приповісті 3:34 і Якова 4:6–10, Бог дає благодать?"}, {"q": "Що означає, що Бог «противиться» гордим?"}, {"q": "Брат організовує великий проєкт у церкві. Справа корисна, але він часто каже: «Нехай усі побачать, на що я здатний». Що з уроку стосується цього?"}, {"q": "Сестра постійно каже: «Я ніхто, усі кращі за мене». Чи це смирення за уроком?"}, {"q": "Чим, за уроком, вимірюється смирення перед Богом?"}, {"q": "Група в церкві незадоволена пастором і хоче його «скинути», бо в нього справді є недоліки. Що каже урок?"}, {"q": "Хто, за Филип’ян 2:5–8, упокорив Ісуса?"}, {"q": "Чоловік і дружина в суперечці відстоюють кожен своє. Як за уроком у цьому виявилося б смирення?"}, {"q": "Які переваги смирення називає урок? Оберіть усі правильні."}, {"q": "Що, за уроком, означає смирення перед Богом? Оберіть усі правильні."}, {"q": "Бог противиться людині саме в тій ділянці, де в неї є гордість."}, {"q": "Якщо ти не вирішиш відкласти свою гордість, Бог зробить це за тебе."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як за уроком розвивалася історія Вавилонської вежі? Розставте по порядку."}, {"q": "У якій ділянці – служіння, робота, становище – ви можете будувати свою «Вавилонську вежу»? Як перевірите свої мотиви?"}]}, {"chapter": 3, "title": "Що чинить благодать і наша участь у ній", "questions": [{"q": "З чого, за Ефесян 1:6–7, ми маємо прощення гріхів?"}, {"q": "Чим, за уроком, відвага перед Богом відрізняється від зухвалості?"}, {"q": "Брат образив вас, а тепер намагається загладити провину подарунками. Як учинити за уроком?"}, {"q": "Сестра має дар навчати дітей, але каже: «Нехай цим займаються інші, мені й так добре». Що за уроком їй загрожує?"}, {"q": "Що, за уроком, означає, що благодать дає силу перемагати гріх (Римлян 5:20–21)?"}, {"q": "Віруючий приходить молитися з думкою: «Я такий нещасний, може, Бог мене пожаліє». Що порадити за уроком?"}, {"q": "Що, за уроком, Бог створює спершу – мету чи людину?"}, {"q": "Брат часто дратується на одного з членів церкви і поступово перестає його любити, а потім дивується, чому в його житті менше благодаті. Що пояснює урок?"}, {"q": "Що, за уроком, чинить благодать у нашому житті? Оберіть усі правильні."}, {"q": "Звідки, за уроком, приходить відвага перед Богом? Оберіть усі правильні."}, {"q": "Благодать для служіння приходить разом з даром: у Павла вона була для язичників, у Петра – для юдеїв."}, {"q": "Чи буде Божа благодать у моєму житті марною, залежить від обставин, а не від мене."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте події притчі про виноградник (Ісая 5:1–6) по порядку."}, {"q": "У чому виявляється Божа благодать у вашому житті? Як ви служите цим іншим?"}]}, {"chapter": 4, "title": "Гордість: звідки вона і в чому її суть", "questions": [{"q": "Від кого, за уроком, походить гордість?"}, {"q": "Що, за уроком, є суттю гордості?"}, {"q": "Після закінчення Біблійної школи брат зверхньо дивиться на новонавернених: «Вони ж нічого не знають». Яке джерело гордості тут діє?"}, {"q": "На нараді хтось дає мудру пораду, а лідер відкидає її лише тому, що ідея не його. Як урок це називає?"}, {"q": "Що, за уроком, відбувається, коли порівнюєш себе з іншими?"}, {"q": "Людина багато постить і молиться, а потім каже іншим: «Я молюся більше за вас». Що скаже урок?"}, {"q": "Хто, за уроком, хвалив себе і був упокорений, доки не смирився (Даниїл 4:27–34)?"}, {"q": "Брат помітив у собі гордість після підвищення на роботі. Що порадити йому за уроком?"}, {"q": "Що урок називає джерелами гордості? Оберіть усі правильні."}, {"q": "До чого, за уроком, веде гордість? Оберіть усі правильні."}, {"q": "Люцифер був помазаним херувимом і печаттю досконалості, але загордився через свою красу."}, {"q": "Досить смиритися один раз – і з гордістю покінчено назавжди."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як за уроком розгорталася історія Навуходоносора? Розставте по порядку."}, {"q": "Згадайте свій останній успіх. Що ви тоді думали про себе й інших і кому віддали славу?"}]}]}, {"slug": "dukhovna-viina", "label": "Урок 8", "title": "Духовна війна", "chapters": [{"chapter": 1, "title": "Що таке духовна війна · Хто наш ворог", "questions": [{"q": "Як урок визначає духовну війну?"}, {"q": "Чому, за уроком, ми не боремося з дияволом «на одному рівні» (Ефесян 2:6)?"}, {"q": "Сестра щоразу після сварки з чоловіком говорить: «Я так і знала, що диявол знову напав на мій дім, він живе в нашій квартирі». Що з уроку варто їй нагадати?"}, {"q": "Брат, який нещодавно втратив роботу, раптом почав думати про легкі, але нечесні гроші. Що урок каже про те, як працює диявол?"}, {"q": "Що означає трій розуму, який потребує не вигнання, а перенавчання."}, {"q": "Ми залишаємося в Божій армії навіть тоді, коли Кров Ісуса перестала над нами діяти."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте по порядку, як урок описує дорогу Ісуса до перемоги."}, {"q": "Яка «твердиня» – переконання, упередження, думка – найбільше заважає вам жити вільно? Яке Боже Слово ви протиставите їй?"}]}, {"chapter": 3, "title": "Всеозброєння Боже · Хвала, життя за духом, наполегливість, ім’я Ісуса", "questions": [{"q": "Яка частина Божого всеозброєння, за уроком, не захисна, а наступальна?"}, {"q": "Що, за уроком, означає те, що броня захищала лише груди спереди?"}, {"q": "Брат, який шість років у церкві, раптом вирішив, що він ніколи по-справжньому не покаявся і не прийняв Святого Духа, і зібрався піти від Бога. Яка частина всеозброєння йому найбільше потрібна?"}, {"q": "Новонавернений, який колись курив, знову захотів закурити і кличе всіх виганяти з нього «демона куріння». Що каже урок?"}, {"q": "Що показує історія Йосафата (2 Хронік 20)?"}, {"q": "Чоловік цілий рік живе як хоче, а в кризі каже: «Дияволе, геть!» – і дивується, що нічого не змінюється. Яка думка уроку це пояснює?"}, {"q": "Що, за Дії 3:16, зцілило кульгавого біля храмових дверей?"}, {"q": "Сестра пройшла курс про духовну війну, але через місяць охолола й перестала стояти за те, що отримала. Що з уроку стосується цього?"}, {"q": "Що, за уроком, потрібно, щоб ім’я Ісуса діяло у вашому житті? Оберіть усі правильні."}, {"q": "Що урок називає ділами тіла, а не демонами? Оберіть усі правильні."}, {"q": "Ми вдягаємо в бій власну праведність, бо вона захищає нас від нападів диявола."}, {"q": "Пояс істини з’єднує всю іншу зброю, і без істини решта не діє."}, {"q": "Поєднайте частину всеозброєння з її значенням за уроком."}, {"q": "Розставте по порядку, як урок описує дію Слова, подібного до молота (Єремія 23:29)."}, {"q": "Яку частину Божого всеозброєння вам найважче «тримати на місці»? Що ви почнете робити щодня, щоб це змінити?"}]}, {"chapter": 4, "title": "Види молитов у духовній війні · Молитовні рівні духовної війни", "questions": [{"q": "Які три одкровення, за уроком, потрібні, щоб вести духовну війну?"}, {"q": "Що, за Луки 11:21–22 і Матвія 12:29, треба зробити, перш ніж «розграбувати дім сильного»?"}, {"q": "Під час служіння дівчина кілька днів поспіль вигукує щось дивне, і молодий служитель хоче негайно «виганяти». Що з прикладу Павла (Дії 16:18) варто врахувати?"}, {"q": "Сестра вирішила постити три дні, щоб брат зробив їй пропозицію. Що каже урок?"}, {"q": "Чим, за уроком, корисна молитва іншими мовами (Юди 1:20; 1 Коринтян 14:4)?"}, {"q": "Брат хоче почати «здобувати місто молитвою», але в нього давній конфлікт з дружиною, а з церквою він у розладі. Що каже перший ключ духовної битви?"}, {"q": "Що таке молитва з владою (наказова)?"}, {"q": "Людина в спорі з дияволом крутиться навколо того, чого ще не знає: «А раптом я неправильно розумію…». Що радить урок?"}, {"q": "Які якості, за уроком, потрібні заступникові? Оберіть усі правильні."}, {"q": "Які три складники твердині в невіруючих називає урок? Оберіть усі правильні."}, {"q": "Піст змінює Бога, тому що довше постиш, то швидше Він відповідає."}, {"q": "Усі молитовні рівні мають бути натхненні й скеровані Святим Духом, бо тілесна молитва веде до розчарування та втоми."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте молитовні рівні духовної війни в порядку, який дає урок."}, {"q": "За кого ви готові стати заступником? Яка з якостей заступника – любов, співчуття, милість, співпричетність – вам найбільше потрібна?"}]}, {"chapter": 5, "title": "Здобуття міст і справжня духовна війна", "questions": [{"q": "З чого, за уроком, починається здобуття міст?"}, {"q": "Що урок називає найважливішим у здобутті міст?"}, {"q": "Після потужного євангелізаційного прориву місцева церква нічого не робить далі. Що, за уроком, станеться?"}, {"q": "Молитовна група за місто виявила, що за опором стоїть конкретний чиновник, і хоче «воювати» з ним. Що каже урок?"}, {"q": "Чому, за уроком, Ілля після великої перемоги на Кармелі впав у відчай?"}, {"q": "Молодий лідер хоче зібрати команду тільки з найталановитіших людей. Що з уроку йому варто врахувати?"}, {"q": "Що, за 1 Тимофія 1:18, означає воювати відповідно до пророцтв?"}, {"q": "Церква святкує ламання хліба як звичайний обряд. Що урок каже про ламання хліба?"}, {"q": "Що, за уроком, приваблює Божу славу? Оберіть усі правильні."}, {"q": "Що урок називає перешкодами для Божої слави? Оберіть усі правильні."}, {"q": "Жертовне давання – це теж проголошення в духовній війні: ми поклоняємося не мамоні, а живому Богові."}, {"q": "Щоб Бог зійшов з вогнем, потрібна велика церква: з маленькою групою людей пробудження не починається."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте по порядку, як урок описує початок моравського пробудження."}, {"q": "Поставте собі запитання з уроку: чи не втратив я спраги за Божим Словом, вогню за загубленими душами, близькості зі Святим Духом? Що ви покладете на жертовник?"}]}]}, {"slug": "tserkva", "label": "Урок 9", "title": "Церква", "chapters": [{"chapter": 1, "title": "Що таке церква і для чого вона", "questions": [{"q": "Що таке церква за Новим Заповітом?"}, {"q": "Що, за уроком, означає, що церква має виявляти «любов між собою» (Івана 13:34–35)?"}, {"q": "Брат каже: «Я вірю в Ісуса, а до церкви ходити не обов’язково – молюся вдома сам». Що каже урок?"}, {"q": "Деякі члени церкви приходять туди лише по гроші й допомогу, а самі не хочуть працювати. Як має діяти церква за уроком?"}, {"q": "Чому, за уроком, одному пасторові Бог довірив церкву на 100 людей, а іншому – на 5000?"}, {"q": "Молодий служитель хоче одразу розповісти новонаверненій сестрі про всі проблеми й недоліки лідерів церкви, «щоб вона знала правду». Що порадив би урок?"}, {"q": "Яке місце Писання урок наводить про те, що через церкву Бог виявляє Свою багатогранну мудрість небесним начальствам і владам?"}, {"q": "Церква в місті існує десять років, але про неї майже ніхто в місті не знає, а кількість людей роками не змінюється. Що, за уроком, це показує?"}, {"q": "Які значення слова «церква» називає урок? Оберіть усі правильні."}, {"q": "Які обов’язки церкви описано в уроці за книгою Дії? Оберіть усі правильні."}, {"q": "Голова вселенської церкви – Сам Ісус Христос, а не людина."}, {"q": "Церква за уроком – передусім добре налагоджена організація, у якій можна обійтися без деяких членів."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте в порядку, як за уроком людина входить у церковне життя."}, {"q": "Як ви особисто виявляєте любов у своїй церкві – чи більше чекаєте її від інших? Що зробите цього тижня?"}]}, {"chapter": 2, "title": "Як влаштована помісна церква", "questions": [{"q": "Що таке теократія, на якій ґрунтується устрій помісної церкви?"}, {"q": "Чому структура тисячників і сотників, яку запропонував Їтро, не спрацювала?"}, {"q": "У церкву нової громади прийшов досвідчений служитель з іншої церкви, і пастор хоче одразу поставити його лідером. Що радить урок?"}, {"q": "Пастор доручив лідерові служіння, але всі питання знову й знову повертаються до самого пастора. Що робити за уроком?"}, {"q": "Що зробив Бог, коли Мойсей зрозумів, що сам не може нести народ (Числа 11:16–17)?"}, {"q": "Брат каже: «Пастор має звітувати перед членами церкви, і ми контролюватимемо кожне його рішення». Що каже урок?"}, {"q": "Хто, за уроком, за Біблією є єпископом?"}, {"q": "Брат, який служить у господарському служінні, каже: «Пастор лише молиться, а справжню роботу робимо ми, тож ми важливіші». Що з уроку стосується цього?"}, {"q": "Що урок каже про господарське служіння (дияконство)? Оберіть усі правильні."}, {"q": "Що символізують і що означають підняті руки Мойсея? Оберіть усі правильні."}, {"q": "Бажати бути пастором чи лідером – це гордість."}, {"q": "У групах Г-12 учитель виховує до 12 учнів, і кожен з них згодом сам стає наставником."}, {"q": "Поєднайте
