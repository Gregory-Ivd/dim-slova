кого почати свідчити. Що радить урок?"}, {"q": "Що, за уроком, включає добра звістка? Оберіть усі правильні."}, {"q": "Що входить у бачення церкви щодо євангелізації? Оберіть усі правильні."}, {"q": "Євангелізація – це духовна війна, бо ми відбираємо в диявола людські душі."}, {"q": "Якщо християнин проповідує, він може не чекати, що Господь підтвердить слово знаменнями: це справа лише апостолів."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте за уроком, як росте служіння християнина в євангелізації."}, {"q": "Хто з людей поруч із вами – рідних, сусідів, колег – ще не чув доброї звістки? Що ви зробите цього тижня?"}]}, {"chapter": 2, "title": "Чому ми маємо євангелізувати", "questions": [{"q": "Що означає слово «шукати» в Луки 19:10 для нас?"}, {"q": "Чого, за образом рибалки, вчить урок?"}, {"q": "Колега-юрист завжди впевнений і успішний. Сестра думає: «Йому Бог не потрібен». Що з уроку стосується цього?"}, {"q": "Брат хоче свідчити, але йому байдуже до людей: «Я просто виконую доручення». Чого, за уроком, йому бракує?"}, {"q": "Які три речі, за Луки 10:1–3, 19, Ісус робить для нас?"}, {"q": "Християнин каже: «Встигну розповісти друзям про Ісуса колись потім». Який принцип уроку він ігнорує?"}, {"q": "Чому Павло, за Дії 20:26, міг сказати, що він чистий від крові всіх?"}, {"q": "Сестра почула урок про сторожа і злякалася: «Але ж я нікому не розповідала про Ісуса!» Що з уроку їй варто зробити?"}, {"q": "Які три відповідальності має кожен християнин? Оберіть усі правильні."}, {"q": "Які слова, за 1 Коринтян 15:3–4, мають бути головними в євангелізації? Оберіть усі правильні."}, {"q": "Велике доручення йти по всьому світу і проповідувати Євангеліє стосується кожного християнина."}, {"q": "Ісус їв з грішниками, бо був до них поблажливий і не надавав гріху значення."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як розгортається ланцюжок із Римлян 10:13–15? Розставте від першого кроку."}, {"q": "Напишіть список із кількох людей, за яких ви молитиметеся і з якими поговорите про Ісуса. Як ви відзначатимете результати?"}]}, {"chapter": 3, "title": "Як євангелізувати", "questions": [{"q": "Про що говорить Дії 19:8–10 – головне місце для принципів євангелізації першої церкви?"}, {"q": "Чому, за уроком, чудеса важливі в євангелізації?"}, {"q": "На вулиці людина насміхається і відкидає кожне слово, а поруч інша щиро слухає. Що порадить урок?"}, {"q": "Брат ніяковіє на вулиці і каже: «Мені соромно – люди ж засуджуватимуть». Що за уроком?"}, {"q": "Сестра молиться за спасіння подруги, і подруга раптом стала до неї ворожою. Як це пояснює урок?"}, {"q": "Хлопець хоче ходити на євангелізацію, «щоб знайомитися з дівчатами». Що каже урок?"}, {"q": "Скільки людей увірувало після одного чуда зцілення кульгавого, за Дії 4:4?"}, {"q": "Брат вирішив: «Буду євангелізувати, коли буде вільний час». Через місяць він жодного разу не вийшов. Який крок уроку він пропустив?"}, {"q": "Навіщо, за уроком, на євангелізацію ходять удвох? Оберіть усі правильні."}, {"q": "Що, за уроком, допомагає не лінуватися? Оберіть усі правильні."}, {"q": "Бог може підтвердити чудесами слова євангеліста будь-якого рангу – навіть через дітей."}, {"q": "Партнера в євангелізації краще не міняти, щоб звикнути одне до одного."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як за уроком розгорталася подія біля храму (Дії 3–4)? Розставте по порядку."}, {"q": "Яку мету – скільки людей мають покаятися – ви поставите собі на найближчий місяць? Що зробите, щоб вона росла?"}]}, {"chapter": 4, "title": "Один на один", "questions": [{"q": "Який метод євангелізації урок називає найефективнішим?"}, {"q": "З якого вірша починається дорога за Римлянами?"}, {"q": "Яка за уроком найкраща тривалість особистого свідчення?"}, {"q": "Під час розмови на вулиці співрозмовник розповідає, що його мама хворіє, а сам він шукає роботу. Що радить урок?"}, {"q": "Людина каже: «Я хороша, я ж не вбивця і не злодій». Яке місце з дороги за Римлянами тут доречне і чому?"}, {"q": "Брат підготував свідчення, але розповідає лише про свої успіхи в церкві і закінчує словами «ось так». Чого бракує за уроком?"}, {"q": "Чому важливо, щоб у молитві покаяння людина визнала Ісуса спершу Господом, а потім Спасителем?"}, {"q": "Людина вислухала все, але відмовляється молитися молитвою покаяння і не дозволяє помолитися за неї. Що радить урок?"}, {"q": "Що, за уроком, варто робити під час розмови «один на один»? Оберіть усі правильні."}, {"q": "Що, за уроком, має бути суттю особистого свідчення? Оберіть усі правильні."}, {"q": "Якщо людина збрехала лише один раз, Римлян 6:23 до неї не стосується."}, {"q": "Свідчення треба заздалегідь підготувати і кілька разів відрепетирувати."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Розставте зупинки дороги за Римлянами по порядку."}, {"q": "Підготуйте своє особисте свідчення на дві хвилини: які проблеми були у вас і як Бог допоміг? Чим ви його завершите?"}]}, {"chapter": 5, "title": "Після покаяння і відповіді на заперечення", "questions": [{"q": "Що, за уроком, не можна робити одразу після молитви покаяння?"}, {"q": "Що буквально означає слово «гріх», за уроком?"}, {"q": "Новонавернений каже: «Хрищення – це формальність, я й так спасенний». Що з уроку стосується цього?"}, {"q": "Чоловік каже: «Спершу я кину пити, а тоді прийду до Бога». Що відповісти за уроком?"}, {"q": "Новонавернена плутається: «Мене спокушало, значить, я вже згрішила?» Що каже урок?"}, {"q": "Людина каже: «До церкви не піду – там самі лицеміри». Яку відповідь пропонує урок?"}, {"q": "Що, за Римлян 10:17, допомагає вірі новонаверненого рости?"}, {"q": "Знайома каже: «Я вірю в Бога, але до чого тут Ісус?» Яке місце з уроку тут ключове?"}, {"q": "Чого, за уроком, Бог чекає від новонаверненого? Оберіть усі правильні."}, {"q": "Чому, за уроком, «маленьких гріхів» не буває? Оберіть усі правильні."}, {"q": "Звичайна віра в Бога, за уроком, ще не є спасительною: навіть біси вірять і тремтять."}, {"q": "Завдання євангеліста – спершу довести людині з іншої церкви, що її церква неправильна."}, {"q": "Поєднайте заперечення з місцем Писання, яке урок пропонує у відповідь."}, {"q": "Розставте кроки «переходу кордону» в Царство Боже за уроком."}, {"q": "Яке заперечення невіруючих ви чуєте найчастіше? Як би ви відповіли на нього за уроком і яким місцем Писання?"}]}]}, {"slug": "pomazannia", "label": "Урок 11", "title": "Помазання", "chapters": [{"chapter": 1, "title": "Що таке помазання", "questions": [{"q": "Що таке помазання Святого Духа за уроком?"}, {"q": "Брат чудово грає на гітарі, усі ним захоплюються, але через його служіння нічого не змінюється. Що про це каже урок?"}, {"q": "Для чого, за уроком, дається помазання?"}, {"q": "Служитель почав використовувати служіння, щоб будувати власне ім’я і вплив – «своє царство». Що, за уроком, станеться?"}, {"q": "Новий служитель каже: «Коли мене висвятять на пастора, біси мене боятимуться». Що каже урок?"}, {"q": "Чому внутрішнє помазання важливе і для служіння іншим?"}, {"q": "Що, за уроком, разом показують 1 Івана 2:20, 27 та Івана 14:26?"}, {"q": "Сестра помітила, що молитва стала формальною, а Біблія «не відкривається». Вечорами вона дивиться сумнівні серіали. Що порадити за уроком?"}, {"q": "Які види помазання називає урок? Оберіть усі правильні."}, {"q": "Що робить внутрішнє помазання? Оберіть усі правильні."}, {"q": "Помазання може бути на людині, але не проявлятися, якщо вона не служить Богові."}, {"q": "За Об’явлення 22:11 і уроком, освячення має кінець: зрілому служителю внутрішнє помазання для змін уже не потрібне."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за уроком, помазання робить Божу волю реальною? Розставте по порядку."}, {"q": "Чи є ділянка, де Бог міг би вас помазати, але помазання не проявляється, бо ви там не служите? Що почнете робити?"}]}, {"chapter": 2, "title": "Помазання для служіння", "questions": [{"q": "Що, за уроком, показує Луки 4:18–19?"}, {"q": "Молодий служитель каже: «Сьогодні я нічого не відчуваю, тож за хворих молитися не буду». Що каже урок?"}, {"q": "Як, за Дії 10:38, Бог помазав Ісуса?"}, {"q": "Брат отримав несподіваний успіх у служінні й почав ним хизуватися. Що урок каже про те, коли Бог дає справжнє помазання на служіння?"}, {"q": "Чоловік каже: «Помазання від Бога, тож церква і служителі мені не потрібні». Що відповідає урок?"}, {"q": "Що зробив Єлисей після того, як Ілля накинув на нього плащ?"}, {"q": "Що означали два плащі Іллі?"}, {"q": "Новонавернений хоче одразу великого служіння і вважає «дрібницею» допомагати пасторові з побутовими справами. Що каже урок?"}, {"q": "Які якості Єлисея допомогли йому прийняти помазання? Оберіть усі правильні."}, {"q": "Що урок каже про помазання на допомогу іншим? Оберіть усі правильні."}, {"q": "Помазання на служіння визначає тільки Бог, а не голосування чи вплив людей."}, {"q": "Служити помазаникам треба навіть тоді, коли це йде на шкоду нашій відданості Ісусові."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за уроком, Бог помазує на служіння? Розставте по порядку."}, {"q": "Від чого вам, як Єлисею, треба відмовитися («заколоти волів»), щоб помазання мало перше місце у вашому житті?"}]}, {"chapter": 3, "title": "Шлях до помазання", "questions": [{"q": "Що означає «Ґілґал» і що він символізує в уроці?"}, {"q": "Церква роками робить усе однаково, «бо так заведено», і служіння стало сухим. Який крок шляху до помазання їм потрібен?"}, {"q": "Що урок каже про Божу присутність, яку символізує Бетель?"}, {"q": "Брат переміг бідність, навчився духовної війни і каже: «Я вже всього досяг». Що каже урок?"}, {"q": "Що символізує Єрихон на шляху до помазання?"}, {"q": "Сестра молиться: «Господи, дай мені хоч трохи – мені багато не треба», – і вважає це смиренням. Що каже урок?"}, {"q": "Чого попросив Єлисей в Іллі перед тим, як Іллю було взято (2 Царів 2:9)?"}, {"q": "Щойно покликаний служитель каже: «Бог мене покликав, тож тепер можу служити де завгодно і як хочу». Що каже урок?"}, {"q": "Що, за уроком, потрібно, щоб отримати і зберегти помазання? Оберіть усі правильні."}, {"q": "Що, за уроком, виганяє Божу присутність зі служіння? Оберіть усі правильні."}, {"q": "Коли приходить помазання, нейтральних людей не буде: одні радітимуть, інші заздритимуть."}, {"q": "За 2 Царів 2:1–15, коли Ілля запропонував Єлисею залишитися, той погодився."}, {"q": "Поєднайте місце на шляху Єлисея з його значенням."}, {"q": "Через які місця, за 2 Царів 2:1–6, пройшли Ілля і Єлисей? Розставте по порядку."}, {"q": "Який із кроків – Ґілґал, Бетель, Єрихон чи Йордан – зараз ваш? Що вам треба зробити, щоб іти далі?"}]}, {"chapter": 4, "title": "Спільне помазання", "questions": [{"q": "Що таке спільне помазання?"}, {"q": "Що, за уроком, показує Псалом 133:1–2 про олію, що стікає з голови?"}, {"q": "У малій групі постійні сварки й образи, але всі хочуть «сильного помазання». Що порадити за уроком?"}, {"q": "У церкві кожне служіння тягне в свій бік і має своє бачення. Навколо чого, за уроком, зазвичай будується єдність?"}, {"q": "Що сталося, коли учні однодушно перебували в молитві (Дії 1:14; 2:1, 4, 41)?"}, {"q": "Пастор і лідери щонеділі приходять просто «відпрацювати» зібрання, не проводячи часу в Божій присутності. Що каже урок?"}, {"q": "Церква перестала збиратися на молитву і прославлення, зібрання короткі й «по програмі». Що за уроком відбувається з такою церквою?"}, {"q": "Що сталося, коли Павло і Сила співали Богові в темниці (Дії 16:25–26)?"}, {"q": "Що, за уроком, створює атмосферу для спільного помазання? Оберіть усі правильні."}, {"q": "Що сталося в Дії 4:23–31? Оберіть усі правильні."}, {"q": "Спільне помазання не можна замінити помазанням на кожній окремій людині з групи."}, {"q": "Щоб досягти Євангелієм міста, досить помазання великих євангелістів."}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Що сталося на П’ятидесятницю? Розставте по порядку."}, {"q": "Що особисто ви можете зробити для єдності у вашій церкві чи групі?"}]}, {"chapter": 5, "title": "Зціленн <script>(function () {
  'use strict';
  var root = document.documentElement;
  function $(s, el) { return (el || document).querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  $('#themeBtn').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    ls('sb-theme', next);
  });

  var qd = $('#quiz-data');
  var ENDPOINT = qd.getAttribute('data-endpoint') || '';

  var bySlug = {};

  var m = location.hash.match(/key=([^&]+)/);
  var KEY = m ? decodeURIComponent(m[1]) : ls('sb-pkey');
  if (m) ls('sb-pkey', KEY);

  var status = $('#status');
  function setStatus(t, err) { status.textContent = t; status.className = 'p-status' + (err ? ' err' : ''); }
  function cls(p) { return p >= 85 ? 'g' : p >= 60 ? 'y' : 'r'; }
  function fmtDate(iso, withTime) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var o = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return d.toLocaleString('uk-UA', o);
  }
  function norm(n) { return String(n).toLowerCase().replace(/[’'`ʼ]/g, '’').replace(/\s+/g, ' ').trim(); }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
  }

  /* ---------- вибір уроку ---------- */
  var sel = $('#lesson');
  sel.innerHTML = '<option value="all">Усі уроки – огляд</option>' + LESSONS.map(function (L) {
    return '<option value="' + esc(L.slug) + '">' + esc(L.label + ' · ' + L.title) + '</option>';
  }).join('');
  var cur = ls('sb-plesson');
  if (!cur || (cur !== 'all' && !bySlug[cur])) cur = 'all';
  sel.value = cur;
  sel.addEventListener('change', function () { cur = sel.value; ls('sb-plesson', cur); open = {}; render(); });

  var ROWS = [], open = {};

  // Учні з найкращими результатами по кожному тесту кожного уроку.
  function students(rows) {
    rows = rows.slice().sort(function (a, b) { return a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0; });
    var map = {};
    rows.forEach(function (r) {
      if (!bySlug[r.lesson]) return;
      var k = norm(r.name);
      var s = map[k] || (map[k] = { key: k, name: r.name, rows: [], devices: {}, t: {}, last: '' });
      s.name = r.name;
      s.rows.push(r);
      s.devices[r.uid] = 1;
      s.last = r.ts;
      var tk = r.lesson + '/' + r.ch;
      var t = s.t[tk] || (s.t[tk] = { best: 0, n: 0, latest: null });
      t.best = Math.max(t.best, r.pct);
      t.n++;
      t.latest = r;
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  // Стовпці таблиці: розділи уроку або уроки в огляді.
  function columns() {
    if (cur !== 'all') {
      return bySlug[cur].chapters.map(function (c) {
        return {
          head: 'Розділ ' + c.chapter, sub: c.title,
          cell: function (s) { var t = s.t[cur + '/' + c.chapter]; return t ? { pct: t.best, note: t.n + ' ' + plural(t.n, 'спроба', 'спроби', 'спроб') } : null; }
        };
      });
    }
    return LESSONS.map(function (L) {
      return {
        head: L.label, sub: L.title,
        cell: function (s) {
          var done = L.chapters.filter(function (c) { return s.t[L.slug + '/' + c.chapter]; });
          if (!done.length) return null;
          var avg = Math.round(done.reduce(function (a, c) { return a + s.t[L.slug + '/' + c.chapter].best; }, 0) / done.length);
          return { pct: avg, note: done.length + ' з ' + L.chapters.length + ' тестів' };
        }
      };
    });
  }

  function view() {
    var cols = columns();
    var list = students(ROWS).map(function (s) {
      var cells = cols.map(function (c) { return c.cell(s); });
      var vals = cells.filter(Boolean);
      s.cells = cells;
      s.done = vals.length;
      s.avg = vals.length ? Math.round(vals.reduce(function (a, v) { return a + v.pct; }, 0) / vals.length) : null;
      return s;
    }).filter(function (s) { return cur === 'all' || s.done; });
    return { cols: cols, list: list };
  }

  function renderTiles(v) {
    var tests = 0, sum = 0;
    v.list.forEach(function (s) { s.cells.forEach(function (c) { if (c) { tests++; sum += c.pct; } }); });
    var full = v.list.filter(function (s) { return s.done === v.cols.length; }).length;
    var week = Date.now() - 7 * 864e5;
    var active = v.list.filter(function (s) { return new Date(s.last).getTime() >= week; }).length;
    var all = cur === 'all';
    var t = [[v.list.length, plural(v.list.length, 'учень', 'учні', 'учнів')],
      [tests, all ? 'уроків розпочато' : 'пройдених тестів (без повторів)'],
      [tests ? Math.round(sum / tests) + '%' : '—', 'середній найкращий результат'],
      [full + ' з ' + v.list.length, all ? 'пройшли всі ' + v.cols.length + ' ' + plural(v.cols.length, 'урок', 'уроки', 'уроків') : 'пройшли всі ' + v.cols.length + ' тестів'],
      [active, 'активні за останні 7 днів']];
    $('#tiles').innerHTML = t.map(function (x) { return '<div class="tile"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('');
  }

  function renderGrid(v) {
    var q = norm($('#search').value), sort = $('#sort').value;
    var list = v.list.filter(function (s) { return !q || s.key.indexOf(q) >= 0; });
    list.sort(function (a, b) {
      if (sort === 'avg') return (b.avg === null ? -1 : b.avg) - (a.avg === null ? -1 : a.avg);
      if (sort === 'last') return a.last < b.last ? 1 : -1;
      return a.name.localeCompare(b.name, 'uk');
    });
    var span = v.cols.length + 3;
    var head = '<thead><tr><th>Учень</th>' + v.cols.map(function (c) {
      return '<th>' + esc(c.head) + '<small>' + esc(c.sub) + '</small></th>';
    }).join('') + '<th>Середній</th><th>Остання активність</th></tr></thead>';
    var body = list.map(function (s) {
      var dev = Object.keys(s.devices).length;
      var cells = s.cells.map(function (x) {
        if (!x) return '<td><span class="cell n">—</span></td>';
        return '<td><span class="cell ' + cls(x.pct) + '">' + x.pct + '%<small>' + esc(x.note) + '</small></span></td>';
      }).join('');
      var row = '<tr class="st" tabindex="0" data-k="' + esc(s.key) + '" aria-expanded="' + (open[s.key] ? 'true' : 'false') + '"><td>' + esc(s.name) +
        (dev > 1 ? '<small>' + dev + ' пристрої</small>' : '') + '</td>' + cells +
        '<td class="avg">' + (s.avg === null ? '—' : s.avg + '%') + '</td><td>' + esc(fmtDate(s.last)) + '</td></tr>';
      if (open[s.key]) row += '<tr class="det"><td colspan="' + span + '">' + details(s) + '</td></tr>';
      return row;
    }).join('');
    $('#grid').innerHTML = head + '<tbody>' + (body || '<tr><td colspan="' + span + '">Нікого не знайдено.</td></tr>') + '</tbody>';
  }

  function details(s) {
    var rows = s.rows.filter(function (r) { return cur === 'all' || r.lesson === cur; }).reverse().map(function (r) {
      var wrong = (r.q || []).map(function (v, i) { return v !== null && v < 1 ? i + 1 : null; }).filter(function (x) { return x; });
      var L = bySlug[r.lesson];
      return '<tr><td>' + esc(fmtDate(r.ts, true)) + '</td><td>' + (cur === 'all' ? esc(L.title) + ', р' : 'Р') + 'озділ ' + esc(r.ch) + '</td><td><b>' + esc(r.pct) + '%</b> (' + esc(r.score) + ' з ' + esc(r.max) + ')</td><td>' + esc(r.attempt) + '</td>' +
        '<td class="miss">' + (wrong.length ? 'Помилки в питаннях: ' + wrong.join(', ') : 'Без помилок') + '</td></tr>';
    }).join('');
    return '<table class="tries"><thead><tr><th>Коли</th><th>Тест</th><th>Результат</th><th>Спроба</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderQuestions(v) {
    var L = bySlug[cur];
    var html = L.chapters.map(function (c) {
      var sum = [], cnt = [];
      v.list.forEach(function (s) {
        var t = s.t[cur + '/' + c.chapter];
        if (!t) return;
        (t.latest.q || []).forEach(function (x, i) {
          if (x === null || x === undefined) return;
          sum[i] = (sum[i] || 0) + x; cnt[i] = (cnt[i] || 0) + 1;
        });
      });
      var qs = c.questions.map(function (qq, i) { return { i: i, text: qq.q, n: cnt[i] || 0, p: cnt[i] ? Math.round(sum[i] / cnt[i] * 100) : null }; })
        .filter(function (x) { return x.p !== null; });
      if (!qs.length) return '';
      qs.sort(function (a, b) { return a.p - b.p || a.i - b.i; });
      var id = 'qall' + c.chapter;
      var rows = qs.map(function (x, k) {
        return '<div class="qrow"' + (k >= 5 ? ' data-more="' + id + '" hidden' : '') + '><span class="no">№' + (x.i + 1) + '</span><span>' + esc(x.text) + '</span>' +
          '<span class="qbar ' + cls(x.p) + '"><span class="bar"><i style="width:' + x.p + '%"></i></span><span>' + x.p + '%<br><small>' + x.n + ' уч.</small></span></span></div>';
      }).join('');
      var more = qs.length > 5 ? '<button class="linkish qmore" type="button" data-toggle="' + id + '">Показати всі питання (' + qs.length + ')</button>' : '';
      return '<div class="qch"><h3>Розділ ' + c.chapter + '. ' + esc(c.title) + '</h3>' + rows + more + '</div>';
    }).join('');
    $('#questions').innerHTML = html || '<p class="p-hint">Ще немає даних.</p>';
  }

  function render() {
    var v = view();
    $('#gridHint').textContent = cur === 'all'
      ? 'Число – середній найкращий результат тестів уроку, під ним – скільки тестів пройдено. Натисніть на учня, щоб побачити всі спроби.'
      : 'Число – найкращий результат тесту, під ним – кількість спроб. Натисніть на учня, щоб побачити всі спроби.';
    renderTiles(v);
    $('#studentsCard').hidden = !v.list.length;
    $('#questionsCard').hidden = cur === 'all' || !v.list.length;
    $('#empty').hidden = !!v.list.length || !ROWS.length;
    if (!v.list.length) return;
    renderGrid(v);
    if (cur !== 'all') renderQuestions(v);
  }

  $('#questions').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-toggle]');
    if (!b) return;
    var id = b.getAttribute('data-toggle');
    document.querySelectorAll('[data-more="' + id + '"]').forEach(function (el) { el.hidden = false; });
    b.remove();
  });
  function toggleRow(tr) {
    var k = tr.getAttribute('data-k');
    open[k] = !open[k];
    renderGrid(view());
  }
  $('#grid').addEventListener('click', function (ev) { var tr = ev.target.closest('tr.st'); if (tr) toggleRow(tr); });
  $('#grid').addEventListener('keydown', function (ev) {
    var tr = ev.target.closest('tr.st');
    if (tr && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); toggleRow(tr); }
  });
  $('#search').addEventListener('input', function () { renderGrid(view()); });
  $('#sort').addEventListener('change', function () { renderGrid(view()); });

  $('#csvBtn').addEventListener('click', function () {
    var head = ['Час', 'Ім’я', 'Урок', 'Розділ', 'Тест', '%', 'Бали', 'З', 'Спроба', 'Пристрій'];
    var lines = [head].concat(ROWS.map(function (r) {
      var L = bySlug[r.lesson];
      return [new Date(r.ts).toLocaleString('uk-UA'), r.name, L ? L.title : r.lesson, r.ch, r.title, r.pct, r.score, r.max, r.attempt, r.uid];
    })).map(function (row) {
      return row.map(function (v) { v = String(v); if (/^[=+\-@]/.test(v)) v = '\'' + v; return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';');
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rezultaty-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  function load() {
    if (!ENDPOINT) return setStatus('Сторінку ще не під’єднано до таблиці результатів.', true);
    if (!KEY) return setStatus('Відкрийте сторінку за посиланням, яке вам надіслали: у ньому є ключ доступу.', true);
    setStatus('Завантаження…');
    fetch(ENDPOINT + '?key=' + encodeURIComponent(KEY))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) {
          setStatus(res.error === 'denied' ? 'Ключ доступу недійсний. Попросіть нове посилання.' : 'Помилка: ' + res.error, true);
          return;
        }
        ROWS = res.rows.map(function (r) { r.lesson = r.lesson || 'slovo-bozhe'; return r; });
        $('#csvBtn').disabled = !ROWS.length;
        $('#lessonBar').hidden = false;
        setStatus(ROWS.length ? 'Оновлено ' + new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) + '.'
          : 'Поки що ніхто не пройшов тест. Результати з’являться тут, щойно учні почнуть проходити тести.');
        render();
      })
      .catch(function () { setStatus('Не вдалося завантажити результати. Перевірте інтернет і натисніть «Оновити».', true); });
  }
  $('#reloadBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
