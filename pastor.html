<style>/* ---------- кольори ---------- */
:root {
  --bg: #f4efe4;
  --paper: #fffdf8;
  --ink: #1f2430;
  --muted: #5d6474;
  --navy: #1f3a5f;
  --navy-deep: #152a45;
  --gold: #b0852b;
  --gold-soft: #f2e6c8;
  --gold-line: #dcc896;
  --scr-bg: #f8f1e1;
  --scr-ink: #3f3320;
  --note-bg: #edf1f6;
  --note-line: #9fb2c8;
  --key-bg: #1f3a5f;
  --key-ink: #fdfaf2;
  --mark: #f6e3ad;
  --ok: #2f7a4f;
  --ok-bg: #e5f2ea;
  --bad: #a3392f;
  --bad-bg: #f8e6e3;
  --part: #9a6b12;
  --part-bg: #f8eed6;
  --line: #e4dccb;
  --shadow: 0 1px 2px rgba(31, 36, 48, .06), 0 8px 24px rgba(31, 36, 48, .06);
  --fs: 18px;
  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  --display: "Cormorant Garamond", "PT Serif", Georgia, serif;
  --sans: "Montserrat", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141c; --paper: #161b25; --ink: #e8e4da; --muted: #a3a9b6;
    --navy: #9fbbe0; --navy-deep: #0d1a2c; --gold: #d4a94f; --gold-soft: #3a3120; --gold-line: #5c4c2b;
    --scr-bg: #1e2230; --scr-ink: #eadfc6; --note-bg: #1a2230; --note-line: #3f5673;
    --key-bg: #22385a; --key-ink: #f4efe2; --mark: #5a4a22;
    --ok: #7fcf9d; --ok-bg: #1d3327; --bad: #f09a8f; --bad-bg: #3a2220; --part: #e6c170; --part-bg: #3a3020;
    --line: #2a3140; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141c; --paper: #161b25; --ink: #e8e4da; --muted: #a3a9b6;
  --navy: #9fbbe0; --navy-deep: #0d1a2c; --gold: #d4a94f; --gold-soft: #3a3120; --gold-line: #5c4c2b;
  --scr-bg: #1e2230; --scr-ink: #eadfc6; --note-bg: #1a2230; --note-line: #3f5673;
  --key-bg: #22385a; --key-ink: #f4efe2; --mark: #5a4a22;
  --ok: #7fcf9d; --ok-bg: #1d3327; --bad: #f09a8f; --bad-bg: #3a2220; --part: #e6c170; --part-bg: #3a3020;
  --line: #2a3140; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

/* ---------- основа ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); line-height: 1.68; }
a { color: var(--navy); text-decoration-color: var(--gold-line); text-underline-offset: 3px; }
.print-only { display: none; }
.lbl { display: inline-block; font-family: var(--sans); font-size: .66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
strong { color: var(--navy); }
main { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }
main > section, .chapter { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: clamp(22px, 5vw, 56px); margin: 22px 0; }
p { margin: 0 0 1em; }

/* ---------- верхня панель ---------- */
.progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 60; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #e3c170); }
.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand .emblem { width: 30px; height: 30px; color: var(--gold); flex: none; }
.brand b { display: block; font-family: var(--sans); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.brand small { display: block; font-family: var(--sans); font-size: .66rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icon-btn, .chip { font-family: var(--sans); font-size: .72rem; font-weight: 600; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.icon-btn:hover, .chip:hover { border-color: var(--gold); }
.chip[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); }
.chip.solid { background: var(--navy); color: var(--paper); border-color: var(--navy); }
:root[data-theme="dark"] .chip.solid { color: #10141c; }
@media (max-width: 720px) {
  #memoBtn { font-size: 0; padding: 0; width: 36px; }
  #memoBtn::before { content: "👁"; font-size: 15px; }
  #fsDown, #fsUp { display: none; }
  .brand small { max-width: 44vw; }
}

/* ---------- зміст ---------- */
.toc-drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); background: var(--paper); z-index: 70; transform: translateX(-102%); transition: transform .25s ease; box-shadow: var(--shadow); overflow-y: auto; }
.toc-drawer.open { transform: none; }
.toc-inner { padding: 24px 22px 40px; }
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .4); z-index: 65; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.toc-list { list-style: none; margin: 10px 0 0; padding: 0; font-family: var(--sans); font-size: .8rem; }
.toc-list > li { margin: 0 0 12px; }
.toc-list > li > a { font-weight: 700; color: var(--ink); text-decoration: none; }
.toc-list ol { list-style: none; padding: 4px 0 0 12px; margin: 0; border-left: 2px solid var(--line); }
.toc-list ol a { display: block; padding: 3px 0; color: var(--muted); text-decoration: none; font-weight: 500; line-height: 1.35; }
.toc-list a.active { color: var(--gold); }
@media (min-width: 1280px) {
  .toc-drawer { transform: none; top: 53px; width: 290px; background: transparent; box-shadow: none; z-index: 10; }
  .toc-inner { padding-top: 28px; }
  #tocBtn, .scrim { display: none; }
  main { margin-left: max(310px, calc(50vw - 410px)); }
}

/* ---------- обкладинка ---------- */
.cover { background: radial-gradient(120% 90% at 50% 0%, #2a4c78 0%, #1f3a5f 45%, #122540 100%) !important; color: #f7f1e3; text-align: center; min-height: min(92vh, 860px); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.cover::before, .cover::after { content: ""; position: absolute; inset: 22px; border: 1px solid rgba(212, 169, 79, .45); border-radius: 12px; pointer-events: none; }
.cover::after { inset: 30px; border-color: rgba(212, 169, 79, .2); }
.cover-inner { position: relative; max-width: 560px; padding: 40px 10px; }
.cover-church { font-family: var(--sans); font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: #e3c882; margin: 0 0 34px; }
.cover-emblem { width: 92px; height: 92px; color: #d9b25e; margin: 0 auto 16px; display: block; }
.cover-school { font-family: var(--sans); font-weight: 600; letter-spacing: .34em; text-transform: uppercase; font-size: .86rem; margin: 0; color: #f1e7cf; }
.cover-name { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 2rem; color: #e3c882; margin: 2px 0 26px; }
.cover h1 { font-family: var(--display); font-weight: 600; font-size: clamp(3.4rem, 12vw, 6.2rem); line-height: 1; margin: 14px 0 8px; color: #fff8e8; letter-spacing: .01em; }
.cover-sub { font-family: var(--display); font-style: italic; font-size: 1.5rem; color: #e3c882; margin: 0 0 28px; }
.cover-meta { font-size: .86rem; line-height: 1.7; color: #cdd6e4; max-width: 460px; margin: 0 auto 36px; }
.cover-foot { display: flex; justify-content: center; gap: 26px; font-family: var(--sans); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: #aebbd0; margin: 0 0 26px; }
.cover-start { display: inline-block; font-family: var(--sans); font-size: .78rem; font-weight: 600; color: #1f3a5f; background: #e3c882; padding: 12px 22px; border-radius: 999px; text-decoration: none; }

/* ---------- передмова ---------- */
.epigraph { margin: 18px 0 30px; text-align: center; }
.epigraph blockquote { margin: 0 auto; max-width: 600px; font-family: var(--display); font-size: 1.75rem; line-height: 1.35; font-style: italic; color: var(--navy); }
.epigraph blockquote::before { content: "“"; display: block; font-size: 3.2rem; line-height: .6; color: var(--gold); margin-bottom: 6px; }
.epigraph figcaption, .prayer figcaption { font-family: var(--sans); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-top: 10px; }
.lead { font-size: 1.1rem; }
.prayer { margin: 28px 0; padding: 20px 24px; border: 1px dashed var(--gold-line); border-radius: 14px; text-align: center; }
.prayer blockquote { margin: 8px 0 0; font-family: var(--display); font-size: 1.35rem; font-style: italic; color: var(--scr-ink); }
.legend h3 { font-family: var(--sans); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.lg { padding: 12px 14px; border-radius: 10px; font-size: .82rem; line-height: 1.45; }
.lg b { display: block; font-family: var(--sans); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.lg-scr { background: var(--scr-bg); border-left: 3px solid var(--gold); }
.lg-key { background: var(--key-bg); color: var(--key-ink); }
.lg-key b { color: #e3c882; }
.lg-note { background: var(--note-bg); border-left: 3px solid var(--note-line); }
.lg-quiz { background: var(--gold-soft); }
.source-note { margin-top: 26px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- розділ ---------- */
.ch-head { position: relative; padding: 6px 0 26px; margin-bottom: 26px; border-bottom: 1px solid var(--gold-line); }
.ch-head::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 90px; height: 3px; background: var(--gold); }
.ch-num { font-family: var(--sans); font-size: .74rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.ch-head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: 1.08; color: var(--navy); margin: 8px 0 6px; }
.ch-sub { font-family: var(--display); font-style: italic; font-size: 1.3rem; color: var(--muted); margin: 0; }
h3.sec { display: flex; gap: 12px; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: 1.75rem; line-height: 1.2; color: var(--navy); margin: 46px 0 18px; }
.s-num { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: #fff; font-family: var(--sans); font-size: .9rem; font-weight: 700; transform: translateY(-3px); }
h4.sub { font-family: var(--sans); font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); margin: 34px 0 14px; display: flex; align-items: center; gap: 10px; }
h4.sub::after { content: ""; flex: 1; height: 1px; background: var(--gold-line); }

/* Святе Письмо */
.scripture { position: relative; margin: 22px 0 24px; padding: 20px 24px 14px 26px; background: var(--scr-bg); border-left: 4px solid var(--gold); border-radius: 4px 14px 14px 4px; }
.scripture blockquote { margin: 0; font-family: var(--display); font-weight: 500; font-size: 1.24rem; line-height: 1.5; color: var(--scr-ink); }
.scripture sup { font-family: var(--sans); font-size: .56rem; font-weight: 700; color: var(--gold); margin-right: 2px; vertical-align: .55em; }
.scripture .gap { color: var(--gold); }
.scripture figcaption { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.scripture .ref { font-family: var(--sans); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.scripture .syn { font-family: var(--sans); font-size: .66rem; color: var(--muted); }
.scripture .more { display: none; }
.scripture.collapsed blockquote { max-height: 11.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.scripture.long .more { display: inline-block; margin-top: 8px; font-family: var(--sans); font-size: .7rem; font-weight: 600; color: var(--navy); background: transparent; border: 1px solid var(--gold-line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
body.memo .scripture blockquote { filter: blur(7px); cursor: pointer; user-select: none; transition: filter .2s; }
body.memo .scripture.revealed blockquote { filter: none; }
body.memo .scripture::before { content: "Натисніть, щоб відкрити"; position: absolute; right: 14px; top: 10px; z-index: 1; font-family: var(--sans); font-size: .62rem; color: var(--muted); }
body.memo .scripture.revealed::before { content: none; }

/* Головна думка, пояснення */
.key-idea { margin: 24px 0; padding: 18px 24px 16px; background: var(--key-bg); color: var(--key-ink); border-radius: 14px; position: relative; }
.key-idea .lbl { color: #e3c882; }
.key-idea p { margin: 6px 0 0; font-family: var(--display); font-weight: 600; font-size: 1.32rem; line-height: 1.4; }
mark.key { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; font-weight: 700; padding: 0 1px; }
.note { margin: 20px 0; padding: 14px 20px; background: var(--note-bg); border-left: 3px solid var(--note-line); border-radius: 4px 12px 12px 4px; font-size: .93rem; }
.note .lbl { color: var(--muted); }
.note p { margin: 4px 0 0; }
ul.points { list-style: none; padding: 0; margin: 12px 0 18px; }
ul.points > li { position: relative; padding-left: 26px; margin-bottom: 12px; }
ul.points > li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); }
ul.points .li-head { margin-bottom: .35em; }
ul.points > li > p:not(.li-head) { margin-bottom: .6em; }

/* ---------- тест ---------- */
.quiz { margin-top: 50px; padding: 26px clamp(16px, 4vw, 30px); border-radius: 16px; background: linear-gradient(180deg, var(--gold-soft), transparent 220px); border: 1px solid var(--gold-line); }
.quiz-head h3 { font-family: var(--display); font-size: 1.9rem; color: var(--navy); margin: 6px 0 6px; line-height: 1.15; }
.quiz-intro { font-size: .9rem; color: var(--muted); }
.quiz-print { display: none; }
.q { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; margin: 14px 0; }
.q-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-family: var(--sans); font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.q-top .lvl { padding: 3px 8px; border-radius: 999px; background: var(--note-bg); }
.q-top .lvl.app { background: var(--gold-soft); color: var(--part); }
.q-text { font-weight: 700; margin-bottom: 12px; line-height: 1.5; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: pointer; font-size: .93rem; line-height: 1.45; }
.opt:hover { border-color: var(--gold-line); }
.opt input { margin-top: 4px; accent-color: var(--navy); flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.tf { display: flex; gap: 10px; }
.tf .opt { flex: 1; justify-content: center; }
.match-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.match-row select { width: 100%; font: inherit; font-size: .86rem; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.match-row.right select { border-color: var(--ok); background: var(--ok-bg); }
.match-row.wrong select { border-color: var(--bad); background: var(--bad-bg); }
.match-row .fix { grid-column: 1 / -1; font-size: .8rem; color: var(--ok); }
@media (max-width: 560px) { .match-row { grid-template-columns: 1fr; } }
.order-list { list-style: none; padding: 0; margin: 0; counter-reset: ord; }
.order-list li { display: flex; gap: 8px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; background: var(--paper); font-size: .9rem; line-height: 1.4; counter-increment: ord; }
.order-list li::before { content: counter(ord); font-family: var(--sans); font-weight: 700; font-size: .75rem; color: var(--gold); width: 18px; flex: none; }
.order-list li span { flex: 1; }
.order-list button { font: inherit; font-size: .8rem; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; flex: none; }
.order-list li.right { border-color: var(--ok); background: var(--ok-bg); }
.order-list li.wrong { border-color: var(--bad); background: var(--bad-bg); }
.q textarea { width: 100%; min-height: 90px; font: inherit; font-size: .92rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
.fb { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: .88rem; line-height: 1.5; }
.q.done .fb { display: block; }
.q.ok .fb { background: var(--ok-bg); }
.q.bad .fb { background: var(--bad-bg); }
.q.part .fb { background: var(--part-bg); }
.q.reflect .fb { background: var(--note-bg); }
.fb b.st { font-family: var(--sans); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.q.ok .fb b.st { color: var(--ok); } .q.bad .fb b.st { color: var(--bad); } .q.part .fb b.st { color: var(--part); }
.fb a { font-family: var(--sans); font-size: .74rem; font-weight: 600; display: inline-block; margin-top: 6px; }
.q.missing { border-color: var(--bad); }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.btn { font-family: var(--sans); font-weight: 700; font-size: .8rem; padding: 12px 20px; border-radius: 999px; border: 0; cursor: pointer; background: var(--navy); color: var(--paper); }
:root[data-theme="dark"] .btn { color: #10141c; }
.btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--gold-line); }
.warn { font-size: .85rem; color: var(--bad); }
.result { margin-top: 18px; padding: 20px; border-radius: 14px; background: var(--paper); border: 1px solid var(--gold-line); display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { width: 112px; height: 112px; }
.ring text { font-family: var(--sans); font-weight: 700; font-size: 20px; fill: var(--ink); }
.result h4 { font-family: var(--display); font-size: 1.5rem; margin: 0 0 6px; color: var(--navy); }
.result p { margin: 0 0 8px; font-size: .9rem; }
.levels { grid-column: 1 / -1; display: grid; gap: 8px; }
.lvlbar { display: grid; grid-template-columns: 120px 1fr 48px; gap: 10px; align-items: center; font-family: var(--sans); font-size: .72rem; }
.lvlbar .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.lvlbar .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }

{"q": "Розташуйте етапи того, як, за уроком, з’явилася книга Єремії (і вся Біблія)."}, {"q": "Згідно з 1 Пет. 2:1–2 і Як. 1:21, щоб приймати Слово, треба щось «відкласти». Що саме у вашому серці зараз може бути перешкодою для сприйняття Слова?"}]}, {"chapter": 2, "title": "Характеристики Слова Божого", "questions": [{"q": "Чому, за уроком, Слово Боже неможливо змінити, хоча людські закони змінюються зі зміною влади?"}, {"q": "Державний закон забороняє те, чого навчає Слово Боже. Як, за прикладом Даниїла, має діяти християнин?"}, {"q": "Який висновок урок робить з Еф. 6:12 про те, де перебуває диявол?"}, {"q": "Проповідник каже: «Бог відкрив мені нове вчення, якого немає в Писанні, але воно навіть глибше за Євангеліє». Яке місце з уроку найпряміше відповідає на таку ситуацію?"}, {"q": "Що, за уроком, символізують у Іс. 40:8 трава, квіти і сонце?"}, {"q": "Як урок розрізняє проповідь і навчання Слова Божого?"}, {"q": "Людині, яка роками без роботи, Бог особисто сказав, що вона буде керувати підприємством. Єдина пропозиція – піти туди прибиральницею. Що радить урок?"}, {"q": "Історія Хієла, який відбудував Єрихон за днів Ахава, показує, що…"}, {"q": "Які чинники, за уроком, визначають «температуру» вогню Божого Слова в устах людини? Позначте всі."}, {"q": "Які твердження про виконання Слова Божого відповідають уроку? Позначте всі."}, {"q": "За уроком, у Єр. 5:14 Бог обіцяє зробити вогнем будь-які слова проповідника, якщо той говорить щиро."}, {"q": "У видінні сухих кісток (Єз. 37) Святий Дух прийшов і вдихнув життя після того, як попрацювало Слово Боже."}, {"q": "Урок пояснює, що грецьке слово «созо» у Рим. 1:16 означає лише прощення гріхів."}, {"q": "Зіставте місце Писання з думкою, яку урок з нього виводить."}, {"q": "Розставте в правильному порядку шлях, яким, за уроком, вивільняється Божа сила в слові."}, {"q": "Лідер хоче, щоб його група ожила і загорілася до служіння. Що урок називає першим засобом?"}, {"q": "Християнин роками ходить на служіння, але каже: «Мені вистачає проповідей, а систематичне навчання основ – це для новачків». Що, за уроком, з ним відбуватиметься?"}, {"q": "На чому зараз тримається твоє відчуття стабільності – на людях, грошах, таланті, популярності чи на Слові? Що, за Іс. 40:8 і 1 Петра 1:24–25, станеться з кожною з цих опор під «сонцем» випробувань?"}]}, {"chapter": 3, "title": "Що дає Слово Боже віруючому", "questions": [{"q": "Чому, згідно з уроком, людина, яка вже покаялася, все одно постійно потребує очищення Словом?"}, {"q": "Яке місце Писання урок наводить як відповідь на питання, як юнакові зберегти чистою свою дорогу?"}, {"q": "За уроком, освячення через Слово – це одноразова подія, яка стається в момент, коли людина вперше щиро прочитала Біблію."}, {"q": "Олег регулярно ходить на служіння й уважно слухає проповіді, але нічого з почутого не намагається виконувати: «Головне – слухати, Слово саме подіє». Що, згідно з уроком, він упускає?"}, {"q": "У яких двох напрямках, за уроком, Бог очищає нас через проповідуване Слово (Ів. 15:3)? Оберіть усі правильні."}, {"q": "Ірина активно служить у церкві, але зізнається собі, що робить це здебільшого, щоб її помітили й довели, що вона «не гірша за інших». Що каже урок про таке служіння?"}, {"q": "Чим, за визначенням уроку, є твердиня?"}, {"q": "Розташуйте в тому порядку, як урок описує шлях до поганого вчинку і те, де його можна зупинити."}, {"q": "Андрія постійно переслідують нечисті думки. Він вирішив просто «перетерпіти» силою волі, нічого не змінюючи в стосунках зі Словом. Яку пораду, згідно з уроком, варто йому дати?"}, {"q": "Зіставте місце Писання з думкою, яку урок до нього прив’язує."}, {"q": "Звідки, за уроком, приходить світло і свобода від Божого Слова?"}, {"q": "Досвідчений служитель отримав від Бога чітке спонукання почати нове служіння і одразу взявся до справи так, як робив колись раніше, бо «я це вже вмію». На яку небезпеку вказує урок?"}, {"q": "За уроком, щоб чинити мудро, людині обов’язково потрібна хороша освіта; без неї одкровення Слова мало що дає."}, {"q": "Що, згідно з уроком, робить Слово як світильник на нашому шляху? Оберіть усі правильні."}, {"q": "Людина тяжко хворіє і каже: «Своєю хворобою я прославляю Бога, тому не шукаю зцілення». Як урок пояснює такий стан?"}, {"q": "Як урок визначає засліплення?"}, {"q": "Згадайте рішення, яке ви маєте ухвалити найближчим часом. Як конкретно ви шукатимете в ньому світла Божого Слова – не лише «що робити», а й «як»?"}, {"q": "Чи є у вашому мисленні усталене переконання, яке постійно негативно впливає на ваше життя? Яким місцем Писання ви будете йому протистояти?"}]}, {"chapter": 4, "title": "Що ми маємо робити зі Словом Божим", "questions": [{"q": "Чому, за уроком, важливо, що Бог порівнює Своє Слово саме з хлібом?"}, {"q": "Сестра щодня поспіхом прочитує п’ять розділів, щоб «виконати норму», і вже ввечері не пам’ятає, про що читала. Як оцінює таке читання урок?"}, {"q": "Що, згідно з уроком, дає віруючому одкровення Слова Божого? Оберіть усі правильні варіанти."}, {"q": "Яким місцем Писання урок обґрунтовує думку, що Ісус будує Церкву на камені одкровення від Бога?"}, {"q": "Брат вкладає всі заощадження сім’ї в сумнівний проєкт і на застереження відповідає: «Я роблю це з віри». Що, за уроком, відрізняє виправданий ризик від невиправданого?"}, {"q": "Який головний висновок урок робить з історії про улов риби (Лк. 5:4–6)?"}, {"q": "Установіть відповідність між місцем Писання та думкою, яку урок із нього виводить."}, {"q": "Розташуйте етапи в тому порядку, у якому, за уроком, Слово Боже стає силою в житті людини."}, {"q": "Як, за уроком, найточніше перевірити, чи справді Слово живе у твоєму серці?"}, {"q": "Урок радить регулярно молитися про те, щоб Бог дав віру, адже віра приходить у відповідь на таке прохання."}, {"q": "Які причини зберігати Слово Боже в серці називає урок? Оберіть усі правильні."}, {"q": "Коли, згідно з уроком про дім на камені (Мт. 7:24–27), треба закладати основу свого життя?"}, {"q": "Друг раз у раз потрапляє в ті самі проблеми й щоразу каже: «Нічого, я вчуся на своїх помилках, набираюся досвіду». Що відповів би йому урок?"}, {"q": "Лідер малої групи вирішив проводити масові євангелізації на стадіонах, хоча Бог його до цього не кликав. Які небезпеки такого кроку називає урок? Оберіть усі правильні."}, {"q": "Церква кілька років зосереджена лише на власних внутрішніх проблемах і майже не говорить про Ісуса людям ззовні. Як оцінює таку ситуацію урок?"}, {"q": "Згідно з уроком, людина може проповідувати Євангеліє одразу після покаяння, і це її зміцнює."}, {"q": "Назви одну сферу свого життя, де ти чуєш Слово, але ще не виконуєш його. Що це означає за уроком і що ти зробиш цього тижня?"}, {"q": "Як ти читаєш Біблію: як «з’їдене» Слово чи як християнський звичай? Що конкретно зміниш у своєму читанні?"}]}, {"chapter": 5, "title": "Правила і методи вивчення та тлумачення Біблії", "questions": [{"q": "Яку помилку юдеїв, за уроком, показує Ів. 5:39–40 і вислів Гіллеля про слова Тори?"}, {"q": "Що ілюструє в уроці вислів Мартіна Лютера «Ми йдемо до колиски лише заради дитини»?"}, {"q": "За уроком, слухання й читання Писання дають «мікроскопічний» погляд, а вивчення й роздуми – «телескопічний»."}, {"q": "Зіставте метод вивчення Біблії з його описом."}, {"q": "Оксана хоче зрозуміти, що Біблія каже про святість. Вона відкриває симфонію на слові «святість» і виписує висновки в зошит із посиланнями. Який метод вона застосовує?"}, {"q": "Яке місце Писання урок наводить як доказ того, що саме Писання заохочує вивчати життя біблійних персонажів?"}, {"q": "Що, за уроком, варто робити під час вивчення Біблії? Оберіть усі правильні варіанти."}, {"q": "Що, за уроком, є метою біблійної герменевтики?"}, {"q": "Андрій бере один вірш, що йому сподобався, і будує на ньому висновок, не читаючи вірші до і після. Але висновок не узгоджується з темою розділу. Що каже урок про такий висновок?"}, {"q": "Хтось каже: «Я отримав нове одкровення з одного вірша, іншого підтвердження в Біблії для нього немає, але я впевнений». Яке правило уроку тут порушено?"}, {"q": "Урок радить звертатися до грецьких і єврейських слів, бо кілька різних грецьких слів можуть бути перекладені одним українським словом, хоча мають різні відтінки значення."}, {"q": "Як урок пояснює дії Бога й Авраама в Бут. 15:7–21?"}, {"q": "Що, за уроком, означає єврейська ідіома «лихе око» (Мт. 6:23; Мт. 20:15)? Оберіть усі правильні варіанти."}, {"q": "Хтось доводить, що Бог має людське тіло, бо Біблія говорить про Його «руку» (Іс. 59:1). Яку відповідь підказує урок?"}, {"q": "Хтось із притчі про невірного управителя (Лк. 16:1–9) робить висновок, що Бог схвалює хитрість у грошових справах. Яку помилку він робить, за уроком?"}, {"q": "Який єдиний урок, за конспектом, показує притча про вдову і неправедного суддю (Лк. 18:1–8)?"}, {"q": "Розташуйте правила тлумачення в тому порядку, у якому їх подано в уроці."}, {"q": "Згадайте вірш, який ви колись розуміли інакше, ніж тепер. Яке з семи правил тлумачення допомогло б вам зрозуміти його правильно одразу і чому?"}]}]}, {"slug": "vira", "label": "Урок 1", "title": "Віра", "chapters": [{"chapter": 1, "title": "Що таке віра і як нею жити", "questions": [{"q": "Що, за уроком, є стрижнем віри і саме виявляє віру та її рівень?"}, {"q": "Чому жінка з кровотечею – приклад саме віри, а не просто бажання зцілитися?"}, {"q": "Чим, за уроком, віра відрізняється від безглуздя?"}, {"q": "Поєднайте твердження з тим, що воно описує."}, {"q": "Оксана каже: «Я, звісно, вірю, що Бог зцілює. Але мене, мабуть, це не стосується – у мене особливий випадок». Як це назвати за уроком?"}, {"q": "Андрій двічі поспіль побачив на білбордах слово «Канада» і вирішив, що це Бог кличе його переїхати. Яку помилку він робить, за уроком?"}, {"q": "Віра, як і надія, спрямована в майбутнє."}, {"q": "Лікар поставив Петрові діагноз. Петро вирішив «жити вірою» і всім каже: «Я не хворий, жодної хвороби немає». Що, за уроком, тут неточно?"}, {"q": "Які твердження про Хому та Авраама відповідають уроку? Оберіть усі правильні."}, {"q": "Як урок визначає невіру?"}, {"q": "Ігор каже: «Мені не треба самому вірити – за мене молиться вся церква, а мама взагалі людина великої віри». Що заперечує йому урок?"}, {"q": "Які місця Писання урок наводить щодо невіри Ізраїлю в пустелі? Оберіть усі правильні."}, {"q": "Халев бачив тих самих велетнів, що й інші розвідники, але спирався на Божі слова."}, {"q": "Розставте події з прикладу Ізраїлю в тому порядку, як їх описує урок і Числа 13–14."}, {"q": "Де у вашому житті зараз «правда» (факти) говорить одне, а «істина» (Слово Боже) – інше? Яке слово Бога ви оберете?"}]}, {"chapter": 2, "title": "Як зростає віра і слова віри", "questions": [{"q": "Звідки, за уроком, у людини міра віри?"}, {"q": "Розставте за уроком, як діє принцип «віра від слухання» (Рим. 10:14–17)."}, {"q": "Марина щовечора молиться: «Господи, дай мені більше віри!», але Біблію майже не відкриває. Що їй порадити за уроком?"}, {"q": "За уроком, віра приходить просто від прочитання Слова, навіть без одкровення."}, {"q": "Що, за прикладом сотника і прокаженого, особливо зміцнює віру?"}, {"q": "Денис щойно увірував і хоче одразу «зрушити гори», але злякався першої дрібної проблеми. Який принцип із прикладу Давида допоможе йому?"}, {"q": "Від чого, за уроком, зростає віра? Оберіть усі джерела, названі в уроці."}, {"q": "Яке місце Писання ілюструє зростання віри через свідчення інших?"}, {"q": "Тарас бачив зцілення на конференції і тепер їздить з одного «служіння чудес» на інше, бо «вдома віра гасне». Що він упускає за уроком?"}, {"q": "Чому ім’я Ісуса не подіяло в синів Скеви?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Під час спільної молитви Ольга повторює за сусідкою: «Я здорова!», хоча в серці не має жодного одкровення і сумнівається. Що скаже урок?"}, {"q": "Які два види сповідання називає урок? Оберіть обидва."}, {"q": "Щоб просити Бога, потрібно так само багато віри, як і щоб наказати горі."}, {"q": "Які слова ви найчастіше говорите про свою найбільшу проблему? к?"}, {"q": "За уроком, випробування оминають лише віру, а сім’ю, роботу і посвяту – ні."}, {"q": "Чому дорогоцінна в Божих очах лише випробувана віра?"}, {"q": "Що, за уроком, означають «спокуси», які випробовують віру?"}, {"q": "Тетяна молилася за хвору матір, і раптом їй зателефонували: «Стан погіршився». Яке слово з уроку для неї найважливіше саме зараз?"}, {"q": "Після кількох важких місяців Роман каже: «Мабуть, я щось робив не так, якщо мене так випробовує. У справжнього християнина такого не буває». Що виправить урок?"}, {"q": "Олена в кризі перестала читати Біблію: «Зараз не до того, спершу треба вибратися». Що, за уроком, їй потрібно, щоб вистояти?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Які місця Писання урок наводить у темі «Віра завжди випробовується»? Оберіть усі правильні."}, {"q": "Розставте, як урок описує шлях випробуваної віри."}, {"q": "Згадайте своє останнє випробування. Що допомогло вам вистояти або що б ви зробили інакше тепер?"}]}, {"chapter": 5, "title": "Помічники і вороги віри", "questions": [{"q": "Чому, за уроком, віра без живих стосунків з Ісусом не працює?"}, {"q": "Віталій щодня годину молиться іншими мовами, але Біблію майже не читає і дивується, чому віра не зростає. Що пояснює урок?"}, {"q": "Іра давно ображена на сестру і не може пробачити, але не розуміє, чому її молитви «не працюють». На що вказує урок?"}, {"q": "Урок порівнює віру і довготерпіння з близнятами."}, {"q": "Максим перестав ходити в церкву: «Я й сам можу вірити», – і тепер проводить час лише з колегами-скептиками. Що, за уроком, з ним відбувається?"}, {"q": "Що урок називає помічниками віри? Оберіть усі правильні."}, {"q": "Що спільного, за уроком, між вірою і страхом?"}, {"q": "Звідки, за уроком, приходить страх? Оберіть усі правильні."}, {"q": "Чому Петро почав тонути, ідучи по воді?"}, {"q": "Щоранку Андрій годину гортає тривожні новини, а потім дивується, чому весь день боїться і не може молитися з вірою. Що, за уроком, варто змінити?"}, {"q": "Звідки, за уроком, походять сумніви і як їх перемагати?"}, {"q": "Поєднайте ворога віри з його описом в уроці."}, {"q": "Розставте, як страх, за уроком, «вимикає» віру на прикладі Петра."}, {"q": "За уроком, страх і віра можуть спокійно співіснувати в серці людини."}, {"q": "У якій сфері життя вам бракує віри? Які місця Слова ви почнете досліджувати?"}]}]}, {"slug": "dystsyplina", "label": "Урок 2", "title": "Дисципліна", "chapters": [{"chapter": 1, "title": "Цілі дисципліни і дисциплінарний процес", "questions": [{"q": "Як урок визначає дисципліну?"}, {"q": "Від чого, за уроком, значною мірою залежить успіх служіння?"}, {"q": "Що урок називає цілями дисципліни? Оберіть усі правильні."}, {"q": "Поєднайте складову дисциплінарного процесу з її описом."}, {"q": "Новонавернений Олег ще не знає, як християнинові поводитися з грошима. Що йому найперше потрібно за уроком?"}, {"q": "Ірина знала, що пліткувати неправильно, але останнім часом знову почала. Яка складова дисциплінарного процесу їй потрібна за уроком?"}, {"q": "Віктор різко розмовляє з людьми і щиро вважає це «прямотою». Що, за уроком, йому потрібно?"}, {"q": "Яке місце Писання урок наводить як приклад викриття?"}, {"q": "За уроком, викриття потрібне насамперед тому, хто знає, що помиляється."}, {"q": "Які місця Писання урок наводить щодо настанови? Оберіть усі правильні."}, {"q": "Розставте за уроком, як правильно реагувати на покарання."}, {"q": "Пастор зробив Андрієві зауваження за постійні запізнення на служіння. Андрій образився: «Мене тут не цінують». Що порадить урок?"}, {"q": "За уроком, змінюватися після покарання треба насамперед зовні, щоб інші побачили результат."}, {"q": "Яке місце Писання урок наводить щодо того, що покарання – можливість для навчання?"}, {"q": "Чим настанова відрізняється від виправлення, а виправлення – від викриття? Чого з цього вам зараз найбільше потрібно?"}]}, {"chapter": 2, "title": "Самодисципліна", "questions": [{"q": "Які якості, за уроком, необхідні для самодисципліни?  а допомогти йому з ремонтом. Яку складову характеру це ілюструє?"}, {"q": "Які місця Писання урок наводить щодо кротості? Оберіть усі правильні."}, {"q": "Урок називає радість частиною життя Божого Царства."}, {"q": "Чому, за уроком, для служителя характер важливіший за талант?"}, {"q": "У команді прославлення є дуже обдарований музикант, але він часто зриває репетиції і сперечається з усіма. Що, за уроком, тут головне?"}, {"q": "Розставте за уроком, як формується характер."}, {"q": "Яка зі складових Божого характеру найменше виявляється у вашому житті? Яке місце Писання з уроку ви візьмете для роздумів цього тижня?"}]}, {"chapter": 4, "title": "Планування і небезпеки дисципліни", "questions": [{"q": "Як урок визначає планування?"}, {"q": "Кого урок наводить як біблійні приклади планування? Оберіть усі правильні."}, {"q": "Яке місце Писання про нерозумне нехтування плануванням наводить урок?"}, {"q": "Оксана погоджується на всі прохання в церкві, на роботі й удома, а на головне – сім’ю і час із Богом – сил не лишається. Яку пораду уроку їй варто застосувати?"}, {"q": "За уроком, головне – працювати більше, а не раціональніше."}, {"q": "Поєднайте вид планування з його описом."}, {"q": "Розставте види планування за тривалістю – від найдовшого до найкоротшого."}, {"q": "Лідер молодіжки хоче зрозуміти, куди Бог веде його служіння на найближчі роки. З якого виду планування йому почати за уроком?"}, {"q": "Чим, за уроком, є дисципліна?"}, {"q": "Петро щодня встає о п’ятій на молитву і зневажливо дивиться на тих, хто так не робить: «Вони просто ліниві». Від якої небезпеки застерігає урок?"}, {"q": "Які небезпеки, пов’язані з дисципліною, називає урок? Оберіть усі правильні."}, {"q": "Чим, за уроком, аскетизм відрізняється від законництва?"}, {"q": "Однією з ознак аскетизму урок називає зневажливе ставлення до потреб тіла."}, {"q": "У домашній групі суперечка: чи «духовний» той, хто пропустив одне зібрання, якщо він доглядав хвору матір. Ведучий каже: «Правило є правило». ога не молися, ти недостойна. Передавай свої прохання через нашого старця – він буде за тебе посередником». Що скаже урок?"}, {"q": "За уроком, Ісус заступається за нас і тепер, а Його первосвященство – назавжди."}, {"q": "Що, за уроком, робить Ісус із моєю молитвою?"}, {"q": "Денис згрішив і думає: «Тепер Ісус мене тільки звинувачує, мені нема чого Йому сказати». Що з уроку йому важливо знати?"}, {"q": "Поєднайте місце Писання з думкою уроку."}, {"q": "Як, за уроком, ми можемо приєднатися до заступництва Ісуса?"}, {"q": "Як, за уроком, здійснюється служіння примирення? Оберіть усі правильні."}, {"q": "Що, за уроком, означає слово «підкріплює» в Римлян 8:26?"}, {"q": "Тарас не молиться, бо «Святий Дух і так за мене заступається невимовними зітханнями». Що виправить урок?"}, {"q": "Стогони під час глибокого заступництва іншими мовами урок пропонує приписувати дияволові."}, {"q": "Що, за уроком, правда про «невимовні зітхання»? Оберіть усі правильні."}, {"q": "Розставте за уроком, як моя молитва доходить до Отця разом із заступництвом Ісуса і Духа."}, {"q": "Під час молитви за хвору подругу Ліда відчула глибокий стогін у дусі і злякалася, що «щось не так». Що їй порадить урок?"}, {"q": "Чому Ісус – єдиний посередник між Богом і людиною і як ваше заступництво пов’язане з Його заступництвом?"}]}, {"chapter": 3, "title": "За що ми маємо заступатися", "questions": [{"q": "Як, за уроком, Павло пише про молитву за всіх святих?"}, {"q": "Олег каже: «Навіщо мені молитися за християн у Китаї чи Судані? У нас своїх проблем вистачає». Що відповідає урок?"}, {"q": "Поєднайте, за кого молитися, з тим, про що молитися за уроком."}, {"q": "Які види Божої волі називає урок? Оберіть усі правильні."}, {"q": "Брат у церкві почав грішити, і всі довкола його обговорюють і засуджують. Що, за уроком, варто зробити спершу?"}, {"q": "Про що, за уроком, треба молитися за служителів Божих? Оберіть усі названі в уроці."}, {"q": "Чому, за уроком, за служителів особливо важливо молитися?"}, {"q": <script>(function () {
  'use strict';
  var root = document.documentElement;
  function $(s, el) { return (el || document).querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  $('#themeBtn').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    ls('sb-theme', next);
  });

  var qd = $('#quiz-data');
  var ENDPOINT = qd.getAttribute('data-endpoint') || '';
  var LESSONS = JSON.parse(qd.textContent);
  var bySlug = {};
  LESSONS.forEach(function (L) { bySlug[L.slug] = L; });

  var m = location.hash.match(/key=([^&]+)/);
  var KEY = m ? decodeURIComponent(m[1]) : ls('sb-pkey');
  if (m) ls('sb-pkey', KEY);

  var status = $('#status');
  function setStatus(t, err) { status.textContent = t; status.className = 'p-status' + (err ? ' err' : ''); }
  function cls(p) { return p >= 85 ? 'g' : p >= 60 ? 'y' : 'r'; }
  function fmtDate(iso, withTime) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var o = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return d.toLocaleString('uk-UA', o);
  }
  function norm(n) { return String(n).toLowerCase().replace(/[’'`ʼ]/g, '’').replace(/\s+/g, ' ').trim(); }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
  }

  /* ---------- вибір уроку ---------- */
  var sel = $('#lesson');
  sel.innerHTML = '<option value="all">Усі уроки – огляд</option>' + LESSONS.map(function (L) {
    return '<option value="' + esc(L.slug) + '">' + esc(L.label + ' · ' + L.title) + '</option>';
  }).join('');
  var cur = ls('sb-plesson');
  if (!cur || (cur !== 'all' && !bySlug[cur])) cur = 'all';
  sel.value = cur;
  sel.addEventListener('change', function () { cur = sel.value; ls('sb-plesson', cur); open = {}; render(); });

  var ROWS = [], open = {};

  // Учні з найкращими результатами по кожному тесту кожного уроку.
  function students(rows) {
    rows = rows.slice().sort(function (a, b) { return a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0; });
    var map = {};
    rows.forEach(function (r) {
      if (!bySlug[r.lesson]) return;
      var k = norm(r.name);
      var s = map[k] || (map[k] = { key: k, name: r.name, rows: [], devices: {}, t: {}, last: '' });
      s.name = r.name;
      s.rows.push(r);
      s.devices[r.uid] = 1;
      s.last = r.ts;
      var tk = r.lesson + '/' + r.ch;
      var t = s.t[tk] || (s.t[tk] = { best: 0, n: 0, latest: null });
      t.best = Math.max(t.best, r.pct);
      t.n++;
      t.latest = r;
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  // Стовпці таблиці: розділи уроку або уроки в огляді.
  function columns() {
    if (cur !== 'all') {
      return bySlug[cur].chapters.map(function (c) {
        return {
          head: 'Розділ ' + c.chapter, sub: c.title,
          cell: function (s) { var t = s.t[cur + '/' + c.chapter]; return t ? { pct: t.best, note: t.n + ' ' + plural(t.n, 'спроба', 'спроби', 'спроб') } : null; }
        };
      });
    }
    return LESSONS.map(function (L) {
      return {
        head: L.label, sub: L.title,
        cell: function (s) {
          var done = L.chapters.filter(function (c) { return s.t[L.slug + '/' + c.chapter]; });
          if (!done.length) return null;
          var avg = Math.round(done.reduce(function (a, c) { return a + s.t[L.slug + '/' + c.chapter].best; }, 0) / done.length);
          return { pct: avg, note: done.length + ' з ' + L.chapters.length + ' тестів' };
        }
      };
    });
  }

  function view() {
    var cols = columns();
    var list = students(ROWS).map(function (s) {
      var cells = cols.map(function (c) { return c.cell(s); });
      var vals = cells.filter(Boolean);
      s.cells = cells;
      s.done = vals.length;
      s.avg = vals.length ? Math.round(vals.reduce(function (a, v) { return a + v.pct; }, 0) / vals.length) : null;
      return s;
    }).filter(function (s) { return cur === 'all' || s.done; });
    return { cols: cols, list: list };
  }

  function renderTiles(v) {
    var tests = 0, sum = 0;
    v.list.forEach(function (s) { s.cells.forEach(function (c) { if (c) { tests++; sum += c.pct; } }); });
    var full = v.list.filter(function (s) { return s.done === v.cols.length; }).length;
    var week = Date.now() - 7 * 864e5;
    var active = v.list.filter(function (s) { return new Date(s.last).getTime() >= week; }).length;
    var all = cur === 'all';
    var t = [[v.list.length, plural(v.list.length, 'учень', 'учні', 'учнів')],
      [tests, all ? 'уроків розпочато' : 'пройдених тестів (без повторів)'],
      [tests ? Math.round(sum / tests) + '%' : '—', 'середній найкращий результат'],
      [full + ' з ' + v.list.length, all ? 'пройшли всі ' + v.cols.length + ' ' + plural(v.cols.length, 'урок', 'уроки', 'уроків') : 'пройшли всі ' + v.cols.length + ' тестів'],
      [active, 'активні за останні 7 днів']];
    $('#tiles').innerHTML = t.map(function (x) { return '<div class="tile"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('');
  }

  function renderGrid(v) {
    var q = norm($('#search').value), sort = $('#sort').value;
    var list = v.list.filter(function (s) { return !q || s.key.indexOf(q) >= 0; });
    list.sort(function (a, b) {
      if (sort === 'avg') return (b.avg === null ? -1 : b.avg) - (a.avg === null ? -1 : a.avg);
      if (sort === 'last') return a.last < b.last ? 1 : -1;
      return a.name.localeCompare(b.name, 'uk');
    });
    var span = v.cols.length + 3;
    var head = '<thead><tr><th>Учень</th>' + v.cols.map(function (c) {
      return '<th>' + esc(c.head) + '<small>' + esc(c.sub) + '</small></th>';
    }).join('') + '<th>Середній</th><th>Остання активність</th></tr></thead>';
    var body = list.map(function (s) {
      var dev = Object.keys(s.devices).length;
      var cells = s.cells.map(function (x) {
        if (!x) return '<td><span class="cell n">—</span></td>';
        return '<td><span class="cell ' + cls(x.pct) + '">' + x.pct + '%<small>' + esc(x.note) + '</small></span></td>';
      }).join('');
      var row = '<tr class="st" tabindex="0" data-k="' + esc(s.key) + '" aria-expanded="' + (open[s.key] ? 'true' : 'false') + '"><td>' + esc(s.name) +
        (dev > 1 ? '<small>' + dev + ' пристрої</small>' : '') + '</td>' + cells +
        '<td class="avg">' + (s.avg === null ? '—' : s.avg + '%') + '</td><td>' + esc(fmtDate(s.last)) + '</td></tr>';
      if (open[s.key]) row += '<tr class="det"><td colspan="' + span + '">' + details(s) + '</td></tr>';
      return row;
    }).join('');
    $('#grid').innerHTML = head + '<tbody>' + (body || '<tr><td colspan="' + span + '">Нікого не знайдено.</td></tr>') + '</tbody>';
  }

  function details(s) {
    var rows = s.rows.filter(function (r) { return cur === 'all' || r.lesson === cur; }).reverse().map(function (r) {
      var wrong = (r.q || []).map(function (v, i) { return v !== null && v < 1 ? i + 1 : null; }).filter(function (x) { return x; });
      var L = bySlug[r.lesson];
      return '<tr><td>' + esc(fmtDate(r.ts, true)) + '</td><td>' + (cur === 'all' ? esc(L.title) + ', р' : 'Р') + 'озділ ' + esc(r.ch) + '</td><td><b>' + esc(r.pct) + '%</b> (' + esc(r.score) + ' з ' + esc(r.max) + ')</td><td>' + esc(r.attempt) + '</td>' +
        '<td class="miss">' + (wrong.length ? 'Помилки в питаннях: ' + wrong.join(', ') : 'Без помилок') + '</td></tr>';
    }).join('');
    return '<table class="tries"><thead><tr><th>Коли</th><th>Тест</th><th>Результат</th><th>Спроба</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderQuestions(v) {
    var L = bySlug[cur];
    var html = L.chapters.map(function (c) {
      var sum = [], cnt = [];
      v.list.forEach(function (s) {
        var t = s.t[cur + '/' + c.chapter];
        if (!t) return;
        (t.latest.q || []).forEach(function (x, i) {
          if (x === null || x === undefined) return;
          sum[i] = (sum[i] || 0) + x; cnt[i] = (cnt[i] || 0) + 1;
        });
      });
      var qs = c.questions.map(function (qq, i) { return { i: i, text: qq.q, n: cnt[i] || 0, p: cnt[i] ? Math.round(sum[i] / cnt[i] * 100) : null }; })
        .filter(function (x) { return x.p !== null; });
      if (!qs.length) return '';
      qs.sort(function (a, b) { return a.p - b.p || a.i - b.i; });
      var id = 'qall' + c.chapter;
      var rows = qs.map(function (x, k) {
        return '<div class="qrow"' + (k >= 5 ? ' data-more="' + id + '" hidden' : '') + '><span class="no">№' + (x.i + 1) + '</span><span>' + esc(x.text) + '</span>' +
          '<span class="qbar ' + cls(x.p) + '"><span class="bar"><i style="width:' + x.p + '%"></i></span><span>' + x.p + '%<br><small>' + x.n + ' уч.</small></span></span></div>';
      }).join('');
      var more = qs.length > 5 ? '<button class="linkish qmore" type="button" data-toggle="' + id + '">Показати всі питання (' + qs.length + ')</button>' : '';
      return '<div class="qch"><h3>Розділ ' + c.chapter + '. ' + esc(c.title) + '</h3>' + rows + more + '</div>';
    }).join('');
    $('#questions').innerHTML = html || '<p class="p-hint">Ще немає даних.</p>';
  }

  function render() {
    var v = view();
    $('#gridHint').textContent = cur === 'all'
      ? 'Число – середній найкращий результат тестів уроку, під ним – скільки тестів пройдено. Натисніть на учня, щоб побачити всі спроби.'
      : 'Число – найкращий результат тесту, під ним – кількість спроб. Натисніть на учня, щоб побачити всі спроби.';
    renderTiles(v);
    $('#studentsCard').hidden = !v.list.length;
    $('#questionsCard').hidden = cur === 'all' || !v.list.length;
    $('#empty').hidden = !!v.list.length || !ROWS.length;
    if (!v.list.length) return;
    renderGrid(v);
    if (cur !== 'all') renderQuestions(v);
  }

  $('#questions').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-toggle]');
    if (!b) return;
    var id = b.getAttribute('data-toggle');
    document.querySelectorAll('[data-more="' + id + '"]').forEach(function (el) { el.hidden = false; });
    b.remove();
  });
  function toggleRow(tr) {
    var k = tr.getAttribute('data-k');
    open[k] = !open[k];
    renderGrid(view());
  }
  $('#grid').addEventListener('click', function (ev) { var tr = ev.target.closest('tr.st'); if (tr) toggleRow(tr); });
  $('#grid').addEventListener('keydown', function (ev) {
    var tr = ev.target.closest('tr.st');
    if (tr && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); toggleRow(tr); }
  });
  $('#search').addEventListener('input', function () { renderGrid(view()); });
  $('#sort').addEventListener('change', function () { renderGrid(view()); });

  $('#csvBtn').addEventListener('click', function () {
    var head = ['Час', 'Ім’я', 'Урок', 'Розділ', 'Тест', '%', 'Бали', 'З', 'Спроба', 'Пристрій'];
    var lines = [head].concat(ROWS.map(function (r) {
      var L = bySlug[r.lesson];
      return [new Date(r.ts).toLocaleString('uk-UA'), r.name, L ? L.title : r.lesson, r.ch, r.title, r.pct, r.score, r.max, r.attempt, r.uid];
    })).map(function (row) {
      return row.map(function (v) { v = String(v); if (/^[=+\-@]/.test(v)) v = '\'' + v; return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';');
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rezultaty-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  function load() {
    if (!ENDPOINT) return setStatus('Сторінку ще не під’єднано до таблиці результатів.', true);
    if (!KEY) return setStatus('Відкрийте сторінку за посиланням, яке вам надіслали: у ньому є ключ доступу.', true);
    setStatus('Завантаження…');
    fetch(ENDPOINT + '?key=' + encodeURIComponent(KEY))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) {
          setStatus(res.error === 'denied' ? 'Ключ доступу недійсний. Попросіть нове посилання.' : 'Помилка: ' + res.error, true);
          return;
        }
        ROWS = res.rows.map(function (r) { r.lesson = r.lesson || 'slovo-bozhe'; return r; });
        $('#csvBtn').disabled = !ROWS.length;
        $('#lessonBar').hidden = false;
        setStatus(ROWS.length ? 'Оновлено ' + new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) + '.'
          : 'Поки що ніхто не пройшов тест. Результати з’являться тут, щойно учні почнуть проходити тести.');
        render();
      })
      .catch(function () { setStatus('Не вдалося завантажити результати. Перевірте інтернет і натисніть «Оновити».', true); });
  }
  $('#reloadBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
